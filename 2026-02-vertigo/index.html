<title>めまい患者に対する介入 ／ 受講者用</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500&display=swap">
<style>
:root{
  --bg:#F4F2EC; --panel:#FFFFFF; --ink:#1C2333; --sub:#5F6678; --line:#E2DED4;
  --violet:#4A2A82; --cyan:#00B5E6; --chip:#EDE9F6;
  --shadow:0 1px 2px rgba(20,33,61,.06), 0 10px 30px rgba(20,33,61,.10);
  --disp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1320; --panel:#181F30; --ink:#E8EAF1; --sub:#98A1B7; --line:#28314A;
  --violet:#B49BE8; --cyan:#3FD2FF; --chip:#241C3B;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 34px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#0E1320; --panel:#181F30; --ink:#E8EAF1; --sub:#98A1B7; --line:#28314A;
  --violet:#B49BE8; --cyan:#3FD2FF; --chip:#241C3B;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 34px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
.top{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:8px 12px}
.brand{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--violet);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.brand small{display:block;font-size:10.5px;color:var(--sub);font-weight:500;letter-spacing:.04em}
.tbtn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:9px;
  padding:6px 11px;font-size:12.5px;font-family:var(--body);cursor:pointer;white-space:nowrap}
.tbtn:hover{border-color:var(--violet);color:var(--violet)}
.stage{padding:12px;max-width:1240px;margin:0 auto}
.shot{width:100%;aspect-ratio:1440/810;object-fit:contain;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:block}
.prog{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 2px 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan))}
.meta{display:flex;align-items:baseline;gap:10px;margin:10px 2px 0;flex-wrap:wrap}
.meta__n{font-family:var(--disp);font-weight:700;font-size:13px;color:var(--violet);white-space:nowrap}
.meta__t{font-family:var(--disp);font-weight:700;font-size:16px;flex:1;min-width:200px}
.nav{display:flex;align-items:center;gap:8px;margin:12px 2px 40px}
.nav button{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:11px;padding:13px;font-size:14px;font-family:var(--body);cursor:pointer;font-weight:500}
.nav button:hover{border-color:var(--violet);color:var(--violet)}
.nav button:disabled{opacity:.35;cursor:default}
.hint{font-size:11.5px;color:var(--sub);text-align:center;margin:0 0 40px}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(12,16,26,.5);
  display:flex;align-items:flex-end;justify-content:center}
.sheet__box{background:var(--panel);width:100%;max-width:860px;max-height:86vh;
  border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow)}
@media(min-width:700px){.sheet{align-items:center}.sheet__box{border-radius:18px;max-height:82vh}}
.sheet__top{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center}
.sheet__top h2{font-family:var(--disp);font-size:15px;margin:0;flex:1}
.sheet__body{overflow-y:auto;padding:14px 16px 22px}
.toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.tocit{border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;
  padding:8px 9px;text-align:left;font-family:var(--body)}
.tocit b{display:block;font-size:10.5px;color:var(--violet);margin-bottom:3px}
.tocit span{font-size:11.5px;color:var(--ink);line-height:1.45;display:block}
.tocit[aria-current="true"]{border-color:var(--violet);background:var(--chip)}
</style>

<header class="top">
  <div class="brand">めまい患者に対する介入<small>FNTニューロコミュニティ ／ 2026年2月</small></div>
  <button class="tbtn" id="btnToc">目次</button>
  <a class="tbtn" href="../" style="text-decoration:none">一覧へ</a>
</header>

<main class="stage">
  <img class="shot" id="shot" alt="" decoding="async" fetchpriority="high">
  <div class="prog"><i id="prog"></i></div>
  <div class="meta"><span class="meta__n" id="mn"></span><span class="meta__t" id="mt"></span></div>
  <div class="nav">
    <button id="prev">← 前へ</button>
    <button id="next">次へ →</button>
  </div>
  <p class="hint">← → キー／スワイプで移動</p>
</main>

<script>
const P=[{"n": 1, "t": "あなたならどうする？", "img": "img/p.001.webp"}, {"n": 2, "t": "＜自己紹介＞", "img": "img/p.002.webp"}, {"n": 3, "t": "「めまいが酷くて", "img": "img/p.003.webp"}, {"n": 4, "t": "ワークショップの目標", "img": "img/p.004.webp"}, {"n": 5, "t": "めまい Vertigo", "img": "img/p.005.webp"}, {"n": 6, "t": "加齢によって多数がめまいを経験", "img": "img/p.006.webp"}, {"n": 7, "t": "ふらつき dizziness", "img": "img/p.007.webp"}, {"n": 8, "t": "めまい・ふらつきの原因", "img": "img/p.008.webp"}, {"n": 9, "t": "・１４歳（中２） 女性 ソフトボール部（捕手）", "img": "img/p.009.webp"}, {"n": 10, "t": "視機能検査", "img": "img/p.010.webp"}, {"n": 11, "t": "前庭覚機能検査", "img": "img/p.011.webp"}, {"n": 12, "t": "考察と介入", "img": "img/p.012.webp"}, {"n": 13, "t": "2回目の介入", "img": "img/p.013.webp"}, {"n": 14, "t": "めまいの種類", "img": "img/p.014.webp"}, {"n": 15, "t": "末梢性めまい", "img": "img/p.015.webp"}, {"n": 16, "t": "良性発作性頭位めまい症（BPPV）", "img": "img/p.016.webp"}, {"n": 17, "t": "前庭神経炎", "img": "img/p.017.webp"}, {"n": 18, "t": "・頚部に原因があり、多くの場合、頚部の回転または伸展により生じる", "img": "img/p.018.webp"}, {"n": 19, "t": "鑑別テスト", "img": "img/p.019.webp"}, {"n": 20, "t": "・小脳脳幹梗塞、出欠、腫瘍", "img": "img/p.020.webp"}, {"n": 21, "t": "HINTS", "img": "img/p.021.webp"}, {"n": 22, "t": "・うつ、不安障害、身体表現性障害などの精神疾患によって生じためまい", "img": "img/p.022.webp"}, {"n": 23, "t": "・浮遊感やめまいが3ヵ月以上続く機能的な問題で起こる", "img": "img/p.023.webp"}, {"n": 24, "t": "前庭代償（静的前庭代償）", "img": "img/p.024.webp"}, {"n": 25, "t": "前庭代償（動的前庭代償）", "img": "img/p.025.webp"}, {"n": 26, "t": "ここまでのまとめ", "img": "img/p.026.webp"}, {"n": 27, "t": "・両眼視OK", "img": "img/p.027.webp"}, {"n": 28, "t": "・開眼ロンベルグOK （ふらつきあり）", "img": "img/p.028.webp"}, {"n": 29, "t": "考察と介入", "img": "img/p.029.webp"}, {"n": 30, "t": "3回目の介入", "img": "img/p.030.webp"}, {"n": 31, "t": "前庭機能評価", "img": "img/p.031.webp"}, {"n": 32, "t": "三半規管個別評価（閉眼回転椅子で実施）", "img": "img/p.032.webp"}, {"n": 33, "t": "考察と介入", "img": "img/p.033.webp"}, {"n": 34, "t": "考察と介入", "img": "img/p.034.webp"}, {"n": 35, "t": "介入詳細", "img": "img/p.035.webp"}, {"n": 36, "t": "・2025/12/23 来院（発症3週間後 前回から2週間後）", "img": "img/p.036.webp"}, {"n": 37, "t": "考察と介入", "img": "img/p.037.webp"}, {"n": 38, "t": "今回のまとめ", "img": "img/p.038.webp"}], N=P.length, KEY='ws-2026-02-vertigo';
let i=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function go(k){
  i=Math.max(0,Math.min(N-1,k));
  const d=P[i];
  $('shot').src=d.img; $('shot').alt=d.t||('ページ'+d.n);
  for(const j of [i+1,i+2,i-1]){ if(P[j]){ const im=new Image(); im.src=P[j].img; } }
  $('mn').textContent=`${d.n} / ${N}`;
  $('mt').textContent=d.t||'';
  $('prog').style.width=((i+1)/N*100)+'%';
  $('prev').disabled=i===0; $('next').disabled=i===N-1;
  try{localStorage.setItem(KEY,String(i));}catch(e){}
  window.scrollTo({top:0,behavior:'instant'});
}
$('prev').onclick=()=>go(i-1); $('next').onclick=()=>go(i+1);
addEventListener('keydown',e=>{
  if(document.querySelector('.sheet')){ if(e.key==='Escape') closeSheet(); return; }
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault(); go(i+1);}
  if(e.key==='ArrowLeft') go(i-1);
});
let x0=null,y0=null;
$('shot').addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
$('shot').addEventListener('touchend',e=>{
  if(x0===null)return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
  if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.6) go(i+(dx<0?1:-1));
  x0=null;},{passive:true});

function closeSheet(){const s=document.querySelector('.sheet'); if(s) s.remove();}
$('btnToc').onclick=()=>{
  const inner='<div class="toc">'+P.map((d,k)=>
    `<button class="tocit" data-k="${k}" aria-current="${k===i}"><b>${d.n}</b>`+
    `<span>${esc((d.t||'').slice(0,30))}</span></button>`).join('')+'</div>';
  const el=document.createElement('div'); el.className='sheet';
  el.innerHTML=`<div class="sheet__box"><div class="sheet__top"><h2>目次（全${N}ページ）</h2>`+
    `<button class="tbtn" data-x>閉じる</button></div><div class="sheet__body">${inner}</div></div>`;
  el.addEventListener('click',ev=>{
    if(ev.target===el||ev.target.hasAttribute('data-x')){closeSheet();return;}
    const b=ev.target.closest('[data-k]'); if(b){go(+b.dataset.k); closeSheet();}
  });
  document.body.appendChild(el);
};
let start=0; try{const v=+localStorage.getItem(KEY); if(v>=0&&v<N) start=v;}catch(e){}
go(start);
</script>

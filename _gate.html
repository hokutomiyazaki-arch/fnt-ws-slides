<style>
html.gate-locked body>*:not(#gate){display:none!important}
#gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
 padding:24px;background:#F4F2EC;color:#1C2333;
 font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
@media(prefers-color-scheme:dark){#gate{background:#0E1320;color:#E8EAF1}}
#gate .box{width:100%;max-width:360px;text-align:center}
#gate h1{font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
 font-size:17px;color:#4A2A82;margin:0 0 6px}
@media(prefers-color-scheme:dark){#gate h1{color:#B49BE8}}
#gate p{font-size:12.5px;color:#5F6678;margin:0 0 20px;line-height:1.7}
@media(prefers-color-scheme:dark){#gate p{color:#98A1B7}}
#gate input{width:100%;padding:13px 14px;border:1px solid #E2DED4;border-radius:11px;
 background:#fff;color:#1C2333;font-size:17px;font-family:inherit;text-align:center;
 letter-spacing:.12em;margin:0 0 10px}
@media(prefers-color-scheme:dark){#gate input{background:#181F30;color:#E8EAF1;border-color:#28314A}}
#gate button{width:100%;padding:13px;border:0;border-radius:11px;background:#4A2A82;color:#fff;
 font-size:14.5px;font-family:inherit;font-weight:700;cursor:pointer}
#gate button:hover{background:#5C379E}
#gate .err{font-size:12.5px;color:#D1495B;margin:12px 0 0;min-height:1.4em}
</style>
<script>
(function(){
  var KEY='fnt-ws-gate', HASH='66bb7e00717c45a76c6f9b8a73d74f22d733f51650ca856cceca4e09b97a8884';
  try{ if(localStorage.getItem(KEY)===HASH) return; }catch(e){}
  document.documentElement.className+=' gate-locked';

  function sha(s){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function(b){
      return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('');
    });
  }
  function build(){
    var g=document.createElement('div'); g.id='gate';
    g.innerHTML='<div class="box"><h1>FNTニューロコミュニティ</h1>'+
      '<p>会員向けの資料です。<br>パスコードを入れてください。</p>'+
      '<input id="gp" type="password" inputmode="text" autocomplete="off" '+
      'autocapitalize="off" spellcheck="false" placeholder="パスコード">'+
      '<button id="gb">開く</button><p class="err" id="ge"></p></div>';
    document.body.appendChild(g);
    var ip=g.querySelector('#gp'), bt=g.querySelector('#gb'), er=g.querySelector('#ge');
    function tryOpen(){
      er.textContent='';
      sha((ip.value||'').trim()).then(function(h){
        if(h===HASH){
          try{ localStorage.setItem(KEY,HASH); }catch(e){}
          document.documentElement.className=
            document.documentElement.className.replace(/\s*gate-locked/,'');
          g.remove();
        } else {
          er.textContent='パスコードが違います';
          ip.value=''; ip.focus();
        }
      });
    }
    bt.addEventListener('click',tryOpen);
    ip.addEventListener('keydown',function(e){ if(e.key==='Enter') tryOpen(); });
    setTimeout(function(){ ip.focus(); },50);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',build);
  else build();
})();
</script>

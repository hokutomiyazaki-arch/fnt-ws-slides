<title>神経科学と呼吸（パート2） ／ 受講者用</title>
<style>
html.gate-locked body>*:not(#gate){display:none!important}
#gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
 padding:24px;background:#F4F2EC;color:#1C2333;
 font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
@media(prefers-color-scheme:dark){#gate{background:#0E1320;color:#E8EAF1}}
#gate .box{width:100%;max-width:360px;text-align:center}
#gate h1{font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
 font-size:17px;color:#4A2A82;margin:0 0 6px}
@media(prefers-color-scheme:dark){#gate h1{color:#B49BE8}}
#gate p{font-size:12.5px;color:#5F6678;margin:0 0 20px;line-height:1.7}
@media(prefers-color-scheme:dark){#gate p{color:#98A1B7}}
#gate input{width:100%;padding:13px 14px;border:1px solid #E2DED4;border-radius:11px;
 background:#fff;color:#1C2333;font-size:17px;font-family:inherit;text-align:center;
 letter-spacing:.12em;margin:0 0 10px}
@media(prefers-color-scheme:dark){#gate input{background:#181F30;color:#E8EAF1;border-color:#28314A}}
#gate button{width:100%;padding:13px;border:0;border-radius:11px;background:#4A2A82;color:#fff;
 font-size:14.5px;font-family:inherit;font-weight:700;cursor:pointer}
#gate button:hover{background:#5C379E}
#gate .err{font-size:12.5px;color:#D1495B;margin:12px 0 0;min-height:1.4em}
</style>
<script>
(function(){
  var KEY='fnt-ws-gate', HASH='66bb7e00717c45a76c6f9b8a73d74f22d733f51650ca856cceca4e09b97a8884';
  try{ if(localStorage.getItem(KEY)===HASH) return; }catch(e){}
  document.documentElement.className+=' gate-locked';

  function sha(s){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function(b){
      return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('');
    });
  }
  function build(){
    var g=document.createElement('div'); g.id='gate';
    g.innerHTML='<div class="box"><h1>FNTニューロコミュニティ</h1>'+
      '<p>会員向けの資料です。<br>パスコードを入れてください。</p>'+
      '<input id="gp" type="password" inputmode="text" autocomplete="off" '+
      'autocapitalize="off" spellcheck="false" placeholder="パスコード">'+
      '<button id="gb">開く</button><p class="err" id="ge"></p></div>';
    document.body.appendChild(g);
    var ip=g.querySelector('#gp'), bt=g.querySelector('#gb'), er=g.querySelector('#ge');
    function tryOpen(){
      er.textContent='';
      sha((ip.value||'').trim()).then(function(h){
        if(h===HASH){
          try{ localStorage.setItem(KEY,HASH); }catch(e){}
          document.documentElement.className=
            document.documentElement.className.replace(/\s*gate-locked/,'');
          g.remove();
        } else {
          er.textContent='パスコードが違います';
          ip.value=''; ip.focus();
        }
      });
    }
    bt.addEventListener('click',tryOpen);
    ip.addEventListener('keydown',function(e){ if(e.key==='Enter') tryOpen(); });
    setTimeout(function(){ ip.focus(); },50);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',build);
  else build();
})();
</script>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500&display=swap">
<style>
:root{
  --bg:#F4F2EC; --panel:#FFFFFF; --ink:#1C2333; --sub:#5F6678; --line:#E2DED4;
  --violet:#4A2A82; --cyan:#00B5E6; --chip:#EDE9F6;
  --shadow:0 1px 2px rgba(20,33,61,.06), 0 10px 30px rgba(20,33,61,.10);
  --disp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1320; --panel:#181F30; --ink:#E8EAF1; --sub:#98A1B7; --line:#28314A;
  --violet:#B49BE8; --cyan:#3FD2FF; --chip:#241C3B;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 34px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#0E1320; --panel:#181F30; --ink:#E8EAF1; --sub:#98A1B7; --line:#28314A;
  --violet:#B49BE8; --cyan:#3FD2FF; --chip:#241C3B;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 34px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
.top{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:8px 12px}
.brand{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--violet);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.brand small{display:block;font-size:10.5px;color:var(--sub);font-weight:500;letter-spacing:.04em}
.tbtn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:9px;
  padding:6px 11px;font-size:12.5px;font-family:var(--body);cursor:pointer;white-space:nowrap}
.tbtn:hover{border-color:var(--violet);color:var(--violet)}
.stage{padding:12px;max-width:1240px;margin:0 auto}
.shot{width:100%;aspect-ratio:960/540;object-fit:contain;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:block}
.prog{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 2px 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan))}
.meta{display:flex;align-items:baseline;gap:10px;margin:10px 2px 0;flex-wrap:wrap}
.meta__n{font-family:var(--disp);font-weight:700;font-size:13px;color:var(--violet);white-space:nowrap}
.meta__t{font-family:var(--disp);font-weight:700;font-size:16px;flex:1;min-width:200px}
.nav{display:flex;align-items:center;gap:8px;margin:12px 2px 40px}
.nav button{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:11px;padding:13px;font-size:14px;font-family:var(--body);cursor:pointer;font-weight:500}
.nav button:hover{border-color:var(--violet);color:var(--violet)}
.nav button:disabled{opacity:.35;cursor:default}
.hint{font-size:11.5px;color:var(--sub);text-align:center;margin:0 0 40px}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(12,16,26,.5);
  display:flex;align-items:flex-end;justify-content:center}
.sheet__box{background:var(--panel);width:100%;max-width:860px;max-height:86vh;
  border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow)}
@media(min-width:700px){.sheet{align-items:center}.sheet__box{border-radius:18px;max-height:82vh}}
.sheet__top{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center}
.sheet__top h2{font-family:var(--disp);font-size:15px;margin:0;flex:1}
.sheet__body{overflow-y:auto;padding:14px 16px 22px}
.toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.tocit{border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;
  padding:8px 9px;text-align:left;font-family:var(--body)}
.tocit b{display:block;font-size:10.5px;color:var(--violet);margin-bottom:3px}
.tocit span{font-size:11.5px;color:var(--ink);line-height:1.45;display:block}
.tocit[aria-current="true"]{border-color:var(--violet);background:var(--chip)}
</style>

<header class="top">
  <div class="brand">神経科学と呼吸（パート2）<small>FNTニューロコミュニティ ／ 2026年5月</small></div>

    <button id="next">次へ →</button>
  </div>

</main>

<script>
const P=[{"n": 1, "t": "Part2 に続く...", "img": "img/p.001.webp"}, {"n": 2, "t": "呼吸と脳活動", "img": "img/p.002.webp"}, {"n": 3, "t": "呼吸筋のマッピング", "img": "img/p.003.webp"}, {"n": 4, "t": "患者の姿勢:", "img": "img/p.004.webp"}, {"n": 5, "t": "吸気筋群のマッピング", "img": "img/p.005.webp"}, {"n": 6, "t": "Pectoralis Minor 小胸筋", "img": "img/p.006.webp"}, {"n": 7, "t": "Pectoralis Major 大胸筋", "img": "img/p.007.webp"}, {"n": 8, "t": "Serratus Anterior 前鋸筋（ぜんきょきん）", "img": "img/p.008.webp"}, {"n": 9, "t": "Levatores costarum 肋骨挙筋", "img": "img/p.009.webp"}, {"n": 10, "t": "Serratus posterior superior 上後鋸筋（じょうこうきょきん）", "img": "img/p.010.webp"}, {"n": 11, "t": "Sternocleidomastoid：SCM 胸鎖乳突筋", "img": "img/p.011.webp"}, {"n": 12, "t": "斜角筋（Scalene muscles）", "img": "img/p.012.webp"}, {"n": 13, "t": "呼気筋群のマッピング", "img": "img/p.013.webp"}, {"n": 14, "t": "Rectus Abdominis 腹直筋", "img": "img/p.014.webp"}, {"n": 15, "t": "Transversus Abdominis腹横筋", "img": "img/p.015.webp"}, {"n": 16, "t": "Transverse Thoracis", "img": "img/p.016.webp"}, {"n": 17, "t": "Serratus posterior inferior", "img": "img/p.017.webp"}, {"n": 18, "t": "息止めと呼吸の神経科学", "img": "img/p.018.webp"}, {"n": 19, "t": "随意的な呼吸と⽪質領域", "img": "img/p.019.webp"}, {"n": 20, "t": "関与する主な辺縁系領域", "img": "img/p.020.webp"}, {"n": 21, "t": "関与する主な⽪質領域", "img": "img/p.021.webp"}, {"n": 22, "t": "エアハンガーに関連する脳領域", "img": "img/p.022.webp"}, {"n": 23, "t": "", "img": "img/p.023.webp"}, {"n": 24, "t": "", "img": "img/p.024.webp"}, {"n": 25, "t": "", "img": "img/p.025.webp"}, {"n": 26, "t": "", "img": "img/p.026.webp"}, {"n": 27, "t": "", "img": "img/p.027.webp"}, {"n": 28, "t": "", "img": "img/p.028.webp"}, {"n": 29, "t": "PAGは呼吸への挑戦やその予期を処理することに", "img": "img/p.029.webp"}, {"n": 30, "t": "呼吸とCSF", "img": "img/p.030.webp"}, {"n": 31, "t": "", "img": "img/p.031.webp"}, {"n": 32, "t": "", "img": "img/p.032.webp"}, {"n": 33, "t": "", "img": "img/p.033.webp"}, {"n": 34, "t": "", "img": "img/p.034.webp"}, {"n": 35, "t": "", "img": "img/p.035.webp"}, {"n": 36, "t": "", "img": "img/p.036.webp"}, {"n": 37, "t": "", "img": "img/p.037.webp"}, {"n": 38, "t": "", "img": "img/p.038.webp"}, {"n": 39, "t": "", "img": "img/p.039.webp"}, {"n": 40, "t": "", "img": "img/p.040.webp"}, {"n": 41, "t": "", "img": "img/p.041.webp"}, {"n": 42, "t": "", "img": "img/p.042.webp"}, {"n": 43, "t": "CSFの流れの障害やグリ​ンパティッククリアランスの悪化は、病理学的な老化や認知症", "img": "img/p.043.webp"}, {"n": 44, "t": "呼吸と脳活動", "img": "img/p.044.webp"}, {"n": 45, "t": "呼吸と脳活動", "img": "img/p.045.webp"}, {"n": 46, "t": "鼻呼吸と神経科学", "img": "img/p.046.webp"}, {"n": 47, "t": "鼻呼吸と一酸化窒素（NO）の関係", "img": "img/p.047.webp"}, {"n": 48, "t": "鼻呼吸と認知機能（記憶、感情）", "img": "img/p.048.webp"}, {"n": 49, "t": "左右の鼻と脳への刺激", "img": "img/p.049.webp"}, {"n": 50, "t": "呼吸と脳波", "img": "img/p.050.webp"}, {"n": 51, "t": "左右の鼻呼吸と自律神経への影響", "img": "img/p.051.webp"}, {"n": 52, "t": "左鼻呼吸と副交感神経活動の亢進", "img": "img/p.052.webp"}, {"n": 53, "t": "左右交互鼻呼吸 ANB", "img": "img/p.053.webp"}, {"n": 54, "t": "シータ派とは？", "img": "img/p.054.webp"}, {"n": 55, "t": "左右交互鼻呼吸", "img": "img/p.055.webp"}, {"n": 56, "t": "呼吸と⾃律神経系", "img": "img/p.056.webp"}, {"n": 57, "t": "呼吸と⾃律神経系", "img": "img/p.057.webp"}, {"n": 58, "t": "⼼拍変動 (HRV)とは？", "img": "img/p.058.webp"}, {"n": 59, "t": "ゆっくりとした呼吸とHRV", "img": "img/p.059.webp"}, {"n": 60, "t": "共鳴モデル", "img": "img/p.060.webp"}, {"n": 61, "t": "呼吸のワークで柔軟な思考と行動", "img": "img/p.061.webp"}], N=P.length, KEY='ws-2026-05-breathing-2';
let i=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function go(k){
  i=Math.max(0,Math.min(N-1,k));
  const d=P[i];
  $('shot').src=d.img; $('shot').alt=d.t||('ページ'+d.n);
  for(const j of [i+1,i+2,i-1]){ if(P[j]){ const im=new Image(); im.src=P[j].img; } }
  $('mn').textContent=`${d.n} / ${N}`;
  $('mt').textContent=d.t||'';
  $('prog').style.width=((i+1)/N*100)+'%';
  $('prev').disabled=i===0; $('next').disabled=i===N-1;
  try{localStorage.setItem(KEY,String(i));}catch(e){}
  window.scrollTo({top:0,behavior:'instant'});
}
$('prev').onclick=()=>go(i-1); $('next').onclick=()=>go(i+1);
addEventListener('keydown',e=>{
  if(document.querySelector('.sheet')){ if(e.key==='Escape') closeSheet(); return; }
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault(); go(i+1);}
  if(e.key==='ArrowLeft') go(i-1);
});
let x0=null,y0=null;
$('shot').addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
$('shot').addEventListener('touchend',e=>{
  if(x0===null)return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
  if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.6) go(i+(dx<0?1:-1));
  x0=null;},{passive:true});

function closeSheet(){const s=document.querySelector('.sheet'); if(s) s.remove();}
$('btnToc').onclick=()=>{
  const inner='<div class="toc">'+P.map((d,k)=>
    `<button class="tocit" data-k="${k}" aria-current="${k===i}"><b>${d.n}</b>`+
    `<span>${esc((d.t||'').slice(0,30))}</span></button>`).join('')+'</div>';
  const el=document.createElement('div'); el.className='sheet';
  el.innerHTML=`<div class="sheet__box"><div class="sheet__top"><h2>目次（全${N}ページ）</h2>`+
    `<button class="tbtn" data-x>閉じる</button></div><div class="sheet__body">${inner}</div></div>`;
  el.addEventListener('click',ev=>{
    if(ev.target===el||ev.target.hasAttribute('data-x')){closeSheet();return;}
    const b=ev.target.closest('[data-k]'); if(b){go(+b.dataset.k); closeSheet();}
  });
  document.body.appendChild(el);
};
let start=0; try{const v=+localStorage.getItem(KEY); if(v>=0&&v<N) start=v;}catch(e){}
go(start);
</script>

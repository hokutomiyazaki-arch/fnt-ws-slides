<title>睡眠の応用神経学 ／ 受講者用</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500&display=swap">
<style>
:root{
  --bg:#F4F2EC; --panel:#FFFFFF; --ink:#1C2333; --sub:#5F6678; --line:#E2DED4;
  --violet:#4A2A82; --blue:#1E6FB0; --cyan:#00B5E6; --coral:#D1495B; --chip:#EDE9F6;
  --shadow:0 1px 2px rgba(20,33,61,.06), 0 10px 30px rgba(20,33,61,.10);
  --disp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1320; --panel:#181F30; --ink:#E8EAF1; --sub:#98A1B7; --line:#28314A;
  --violet:#B49BE8; --blue:#6FB3E6; --cyan:#3FD2FF; --coral:#F2808F; --chip:#241C3B;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 34px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#0E1320; --panel:#181F30; --ink:#E8EAF1; --sub:#98A1B7; --line:#28314A;
  --violet:#B49BE8; --blue:#6FB3E6; --cyan:#3FD2FF; --coral:#F2808F; --chip:#241C3B;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 34px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
/* ── ヘッダ ── */
.top{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:8px 12px;box-shadow:0 1px 0 var(--line)}
.brand{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--violet);white-space:nowrap}
.brand small{display:block;font-size:10.5px;color:var(--sub);font-weight:500;letter-spacing:.04em}
.chapchips{display:flex;gap:5px;overflow-x:auto;flex:1;scrollbar-width:none}
.chapchips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:transparent;color:var(--sub);font-family:var(--body);
  font-size:12px;padding:5px 10px;border-radius:999px;white-space:nowrap;cursor:pointer}
.chip[aria-current="true"]{background:var(--violet);color:#fff;border-color:var(--violet);font-weight:700}
.tbtn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:9px;
  padding:6px 11px;font-size:12.5px;font-family:var(--body);cursor:pointer;white-space:nowrap}
.tbtn:hover{border-color:var(--violet);color:var(--violet)}
/* ── スライド ── */
.stage{padding:12px;max-width:1180px;margin:0 auto}
.shot{width:100%;aspect-ratio:1280/1080;object-fit:contain;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:block}
.meta{display:flex;align-items:baseline;gap:10px;margin:10px 2px 0;flex-wrap:wrap}
.meta__n{font-family:var(--disp);font-weight:700;font-size:13px;color:var(--violet)}
.meta__t{font-family:var(--disp);font-weight:700;font-size:16px;flex:1;min-width:200px}
.meta__src{font-size:11.5px;color:var(--sub);width:100%;line-height:1.55}
/* ── 送り ── */
.nav{display:flex;align-items:center;gap:8px;margin:12px 2px 0}
.nav button{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:11px;padding:13px;font-size:14px;font-family:var(--body);cursor:pointer;font-weight:500}
.nav button:hover{border-color:var(--violet);color:var(--violet)}
.nav button:disabled{opacity:.35;cursor:default}
.prog{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 2px 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan))}
/* ── この枚の用語 ── */
.terms{margin:16px 2px 40px}
.terms h3{font-family:var(--disp);font-size:13px;color:var(--sub);margin:0 0 9px;font-weight:700;
  letter-spacing:.05em}
.tgrid{display:flex;flex-wrap:wrap;gap:7px}
.tchip{border:1px solid var(--line);background:var(--chip);color:var(--violet);border-radius:999px;
  padding:6px 12px;font-size:13px;cursor:pointer;font-family:var(--body);font-weight:500}
.tchip:hover{border-color:var(--violet)}
.none{font-size:12.5px;color:var(--sub)}
/* ── 用語集パネル ── */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(12,16,26,.5);
  display:flex;align-items:flex-end;justify-content:center}
.sheet__box{background:var(--panel);width:100%;max-width:720px;max-height:86vh;
  border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow)}
@media(min-width:700px){.sheet{align-items:center}.sheet__box{border-radius:18px;max-height:80vh}}
.sheet__top{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center}
.sheet__top h2{font-family:var(--disp);font-size:15px;margin:0;flex:1}
.sheet__body{overflow-y:auto;padding:6px 16px 22px}
input[type=search]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;
  background:var(--bg);color:var(--ink);font-size:15px;font-family:var(--body);margin:12px 0 4px}
.gcat{margin:16px 0 0}
.gcat h4{font-family:var(--disp);font-size:12px;color:var(--cyan);margin:0 0 7px;letter-spacing:.08em}
.gterm{padding:10px 0;border-top:1px solid var(--line)}
.gterm dt{font-family:var(--disp);font-weight:700;font-size:14.5px;margin:0}
.gterm .en{font-size:11px;color:var(--sub);display:block;margin:2px 0 5px}
.gterm dd{margin:0;font-size:13.5px;line-height:1.72;color:var(--ink)}
.gterm dd b{color:var(--violet)}
mark{background:var(--cyan);color:#04222c;border-radius:3px;padding:0 2px}
/* ── 目次 ── */
.toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.tocit{border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;
  padding:7px;text-align:left;font-family:var(--body)}
.tocit b{display:block;font-size:10.5px;color:var(--violet);margin-bottom:3px}
.tocit span{font-size:11.5px;color:var(--ink);line-height:1.4;display:block}
.tocit[aria-current="true"]{border-color:var(--violet);background:var(--chip)}
.tochead{font-family:var(--disp);font-size:12px;color:var(--cyan);margin:18px 0 8px;letter-spacing:.08em}
.hint{font-size:11.5px;color:var(--sub);text-align:center;margin:14px 0 0}
</style>

<header class="top">
  <div class="brand">睡眠の応用神経学<small>FNTニューロコミュニティ ／ 受講者用</small></div>

<main class="stage">

  <div class="nav">

  <p class="hint">← → キー／スワイプで移動。用語をタップすると意味が出ます</p>
</main>

本WSで「触れる入り口」の集合点。", "keys": ["VLPO／MnPO", "腹外側", "正中視索前野", "VLPO", "MnPO"]}, {"cat": "解剖・核と経路", "term": "TMN（結節乳頭核）", "en": "tuberomammillary nucleus (TMN)", "def": "視床下部後方。脳内で唯一ヒスタミンを作る核。抗ヒスタミン薬で眠くなるのはここを抑えるから。", "keys": ["TMN", "結節乳頭核"]}, {"cat": "解剖・核と経路", "term": "青斑核（LC）", "en": "locus coeruleus (LC)", "def": "橋の小核。脳のノルアドレナリンのほぼ唯一の供給源。覚醒・注意で活発、REMで沈黙。", "keys": ["青斑核", "LC"]}, {"cat": "解剖・核と経路", "term": "縫線核", "en": "raphe nuclei — median raphe / dorsal raphe", "def": "脳幹正中の核群。セロトニンの主要供給源。正中縫線核→SCN の投射は活動開始の時刻を規定する。", "keys": ["縫線核"]}, {"cat": "解剖・核と経路", "term": "PPT・LDT", "en": "pedunculopontine / laterodorsal tegmental nucleus (PPT / LDT)", "def": "橋〜中脳のアセチルコリン核。覚醒とREMの両方で活発（REMのスイッチ役）。IGLへも投射する。", "keys": ["PPT・LDT"]}, {"cat": "解剖・核と経路", "term": "腹側PAG（vPAG／vlPAG）", "en": "ventrolateral periaqueductal gray (vlPAG)", "def": "中脳水道のまわりを縦に走る**中脳水道周囲灰白質（PAG）**の、**腹外側の列**。🔴 **PAGは列ごとに役割が逆**なので、まとめて「PAG」と言うと逆の意味になる。**外側の列**＝能動的防御。血圧が上がり、脈と呼吸が速くなる（闘争逃走）。**腹外側の列**＝その逆。**血圧が下がり、脈が遅くなり、行動が止まる**。ラットでこの列を興奮させると、自発的な活動が完全に止まり（quiescence）、相手が近づいても定位も驚愕も発声もしなくなる（hyporeactivity）。🔴 **そしてここは、電気刺激でもモルヒネの微量注入でも鎮痛が起きる場所**＝下行性疼痛抑制の中心。原著の言い方では、**逃げられない痛み・慢性の損傷・敗北**に対して、動物は運動を減らし、ひとりになり、環境への反応が鈍くなる ── その反応を作っている列。🔴 **慢性痛の人が「動きたくない・人に会いたくない」のは性格ではなく、この反応**として読める。睡眠では**REM-OFF側**で、オレキシンに興奮させられてREMにフタをする。ここが緩むとカタプレキシー。※ただし鎮痛の細胞群とREM-OFFの細胞群が同一かどうかは別問題で、言えるのは**同じ領域**まで。🔴 **そして、ここは「慢性痛の人の眠りが浅い」の説明にはならない**：この列のGABA細胞を興奮させるとREMは減るが、ノンレムは**むしろ固まる**（マウス）。浅くする方向ではない。", "keys": ["腹側PAG", "vPAG", "vlPAG"]}, {"cat": "解剖・核と経路", "term": "SLD（背外側下核）", "en": "sublaterodorsal nucleus (SLD)", "def": "橋のREM-ON核。REMとアトニアの発生器。下行して脊髄運動ニューロンを抑える。", "keys": ["SLD", "背外側下核"]}, {"cat": "解剖・核と経路", "term": "コリン作動性ニューロン", "en": "cholinergic neuron", "def": "アセチルコリンを伝達物質として使うニューロン。**覚醒と、REM睡眠の両方で活発になる**のが特徴で、皮質を細かい速い活動へ切り替える（EEGの脱同期）。睡眠の話で出てくるのは2か所 ── **前脳基底部**（皮質を直接賦活する）と、**脳幹のPPT／LDT**（REM中に皮質を起こし、視床の門を開ける）。🔴 アデノシンがA1受容体を通して抑えるのは、このうち前脳基底部側。アルツハイマー病で最初に脱落するのも前脳基底部のこの細胞群で、コリンエステラーゼ阻害薬がその補充を狙う薬。", "keys": ["コリン作動性ニューロン"]}, {"cat": "解剖・核と経路", "term": "前脳基底部", "en": "basal forebrain", "def": "前頭葉の底にある核の集まり（マイネルト基底核・無名質など）。**アセチルコリンを出すニューロンとGABAのニューロンが混在**し、皮質を広く賦活して覚醒とEEGの脱同期を作る。ここが**アデノシン（睡眠圧）が溜まる場所**。🔴 ラットでこの領域のA1受容体をアンチセンスで潰すと、NREM睡眠が減って覚醒が増え、6時間の断眠後の回復睡眠が**50〜60%**減り、デルタパワーは**60〜75%**落ちた。つまりアデノシンはここに**持続的な抑制**をかけている。ただしアデノシンを与えてもこの領域の発火は覚醒と睡眠で変化し続けたので、**アデノシンだけで決まっているわけではない**。\n🔴 **アルツハイマー病では、ここが一番最初に削られる。** マイネルト基底核の萎縮の程度が、**そのあとの嗅内皮質の萎縮を予測した**（逆向きより支持された）。ADNIの独立した2標本（n=284・n=553）・2年の縦断MRI・髄液のpTauとアミロイドβで調整。「嗅内皮質から始まる」という従来の順番に反論している。\n🔴 **ただし症状を「眠気」と読むと外す。** 日中の強い眠気が特徴的なのは、アルツハイマー型よりも**レビー小体型**のほう（系統的レビュー70本。眠気・睡眠の質の悪さ・レム睡眠行動障害は、他の認知症と比べてレビー小体型で多く重い）。ここが削られて落ちるのは、眠気そのものではなく**注意を配る力**。\n🔴 **「注意を配る係」というのは、気づく瞬間そのものを作っているという意味。** 皮質へのコリン作動性の入力は、注意の成績に**必要**で、注意課題の遂行中に選択的に活動が上がる。さらにラットで、**監視から反応へ切り替わる試行でだけ**アセチルコリンの短い放出（サブ秒〜秒）が起きていた。🔴 光遺伝学でタイミングを外して人工的に出すと、**合図が無い試行で「見つけた」と誤答させられる**。放出のレベルが高いほど「課題に留まる」ほうが選ばれる。", "keys": ["前脳基底部"]}, {"cat": "解剖・核と経路", "term": "H反射（Hoffmann reflex, H-reflex）", "en": "", "def": "🔴 **物質でも部位でもない。測り方の名前＝指標。**\n**①何の仲間か**：腱を叩く反射（膝カックン）を、**電気で起こして大きさを測る**方法。1918年に Paul Hoffmann が記載した。\n**②どう測るか**：皮膚の上から末梢神経に電気を流す → 感覚神経を上って**脊髄**へ → 運動神経を下って筋肉が縮む。その筋肉の反応の大きさを筋電図で測る。**大きいほど、脊髄の反射が出やすい状態**。\n**③なぜ有用か**：腱を叩く反射は筋紡錘（筋の伸びを感じるセンサー）から始まるが、H反射は**そこを飛ばして感覚神経を直接叩く**。だから「センサーの感度が変わったのか、脊髄が変わったのか」を分けられる。さらに、**同じ電気刺激が運動神経を直接下って届く反応（M波）**も同時に記録できる。M波が変わっていなければ、**神経と筋肉そのものは変わっていない**と言える ── だから「変わったのは脊髄」と言い切れる。\n**④スライドでは言えない例外**：🔴 **H反射を「脊髄（α運動ニューロン）の興奮性」の指標として一意に読むことはできない。** 総説（Zehr 2002）が明記している ── 大きさは運動ニューロンの出やすさだけでなく、**その手前で入力が絞られる仕組み（シナプス前抑制）**にも左右されるため。\n🔴 **筋のトーン（紡錘内筋の張力・γ運動ニューロン）との関係はもっとややこしい。** H反射は Ia を電気で直接叩くので、**筋紡錘そのものを迂回している**。だから紡錘内筋の張力が変わっても H反射には出ない ── 逆に言えば、**H反射は「筋のトーンが変わったか」という問いに答えられない**。答えたいなら別の測り方（超音波での硬さ・受動的な抵抗）が要る。\n🔴 **だから「もんだら脊髄が鎮まった」とは言えない。** 言えるのは「H反射が縮んだ」まで。実際、同じ手技で**筋そのものの硬さ**（咬筋30分で−22%）や**筋膜の硬さ**（マッサージガン5分）が下がる研究もあり、**どの層が主役かは決まっていない。**", "keys": ["H反射", "H-reflex"]}, {"cat": "解剖・核と経路", "term": "圧刺激（massage・roller massage）", "en": "", "def": "🔴 **運動ニューロンは実際に鎮まる。しかも用量反応がある。**\nヒトのH反射（**脊髄反射の興奮性**の指標）で3本ある。\n**①圧の強さを定量した研究**（健常20人）：原著は圧を実測して「**軽いマッサージ**」「**深いマッサージ**」の2条件を作り、術者がその圧を出せるよう事前に訓練した。**両方でH反射が下がり、深いほうがより下がった**。M波は安定＝末梢の筋ではなく脊髄側の変化。※圧の実測値は 1.25／2.50 kPa。原著は「抑制の機序は**圧に依存する（pressure sensitive）**」と明記。\n**②マッサージとストレッチ**：H/M比が低下し、**叩打がいちばん強く抑制**。収縮特性は変わらない。\n**③ローラーマッサージのRCT**：ヒラメ筋のH反射が**高強度58%・中強度43%・シャム19%**低下（強度依存）。🔴 ただし**一過性で、終了直後にベースラインへ戻る**。\n🔴 **交感神経の鎮静は、そう単純ではない。** フォームローラー20分のRCT（男性20人）では、**拡張期血圧と末梢血管抵抗が下がり**、冷水負荷への循環の反応も鈍った。**ところがRMSSD（HRVの副交感の指標）は下がり、心拍は上がった。** つまり「圧刺激＝副交感が上がる」とは言えない（→ HRV）。\n🔴 **ここまでの3本は、どれも睡眠を測っていない。** 見ているのは脊髄反射と循環の指標だけ。\n🔴 **さらに「筋が緩む」の中身も、測る層で答えが変わる** ── ①**筋そのもの**：咬筋を30分もむと超音波で測った硬さが **−22%**（21人・もむ前が硬い人ほど大きく低下）／②**筋膜**：マッサージガン5分では**深筋膜だけ下がり、筋は変わらなかった**（15人・足首の背屈 +3.0°）／③**強さ**：同じ研究の中では軽い＜深い。別の研究では叩くほうが筋腱の境目をもむより強いが、**最強はストレッチを足した条件**。🔴 **手技も筋も時間も違うので、別々の研究の数字を一列に並べることはできない。**\n🔴 **そして「筋が緩んだから眠れた」を示した研究は無い。** 硬さを測った研究と睡眠を測った研究は別で、同じ人で両方を測ったものが無い。**睡眠を直接測ったメタ解析**（88研究5,524人）では PSQI が −4.06 だが、同時に下がったのは**心拍・呼吸・血圧**で、**総睡眠時間は動かない**。つまり効いている先は**過覚醒**であって、筋の硬さではない。\n🔴 **では、なぜ過覚醒が下がるのか ── ここは埋まっていない。** メタ解析は「同時に下がった」ことを示しただけで、順序も因果も書いていない。いま言えるのは次の2段まで。\n**①経路**：ゆっくり撫でる速さの触り方を運ぶのは **CT線維（低閾値の無髄の触覚線維）**で、**毛のある皮膚にしかなく、後部島皮質へ投射する**（この経路が抑えられると、優しく撫でられるのが快くなくなる）。\n**②向き**：32人のMRIで、**ゆっくり撫でたあとは痛みを「弱い」と評価し、軽く叩いたあとは「強い」と評価した**。撫でたあとは**中脳水道周囲灰白質（PAG／下行性の痛み抑制の出どころ）**の活動が強かった。🔴 **ただし著者自身が機序を「仮説」と明記している**（触っている最中は、撫でると叩くで差の出た脳領域は無かった）。\n🔴 **つまり「島皮質→PAG→痛みが下がる」までは道が見えているが、「→過覚醒が下がる→眠れる」の一段は、まだ誰も繋いでいない。** 現場で言えるのは向きだけ ── **夜にやるならゆっくり側。叩く側は逆に働きうる。**", "keys": ["圧刺激", "massage"]}, {"cat": "解剖・核と経路", "term": "セロトニン（5-HT, serotonin）", "en": "", "def": "**モノアミン系の神経修飾物質**。脳では**脳幹の背側縫線核**から出て、皮質・視床・脳幹へ広く投射する。\n🔴 **睡眠の文脈では「覚醒側」。** 背側縫線核のセロトニンのニューロンは、**覚醒中はトニックに発火し続け、NREMで減り、REMで止まる**。ナルコレプシーのイヌで記録した研究では、この発火の型がラット・ネコ・サルと同じだった。投射先の細胞外のセロトニン濃度を測っても、ほとんどの領域で**覚醒中が最も高い**。つまり覚醒中はノルアドレナリンとアセチルコリンと一緒に皮質の反応性を上げ、かつ**REMを作るニューロンを抑えている**。\n🔴 **「幸福を感じる物質」は俗説的な単純化。** しかも1960年代の研究は逆に「セロトニンは睡眠に必要」（許容的な役割）と結論していて、そこが混乱のもとになっている。総説はこの食い違いの理由を2つ挙げる ── **①受容体のサブタイプが多数あり、反対向きの反応を作る**（だから「セロトニンが増えると◯◯」と一言で言えない）**②状態は他の系との相互作用で決まる**。\n※ 体のセロトニンの9割以上は腸にあり、**脳のプールとは別**（血液脳関門を越えない）。また**メラトニンの材料**でもある（→ メラトニン）。", "keys": ["セロトニン", "5-HT", "serotonin"]}, {"cat": "解剖・核と経路", "term": "パラフェイシャルゾーン（PZ, parafacial zone）", "en": "", "def": "延髄の、顔面神経核のまわりにある**GABAのニューロン群**。🔴 **「脳幹＝覚醒系」の例外。** 遺伝学的に活性化すると、**時刻に関係なく**徐波睡眠と徐波活動を強力に起動する。回路は PZ（GABA）→ **抑制** → 腕傍核（parabrachial nucleus）→ **グルタミン酸** → 大細胞性の前脳基底部 → 皮質。つまり**消灯側の押しボタンが、脳幹のいちばん下にもある**。脳幹の下部に「徐波睡眠を作る／脳波を同期させる中枢」があるらしいという古い観察に、回路の実体を与えた研究。マウス・遺伝学的な活性化＋光遺伝学による経路の同定。※ヒトでの確認はまだない。\n🔴 **末梢からは狙えない。** PZは延髄の深部で、体表から届く経路がない。一番近いのは腕傍核・孤束核に入る**迷走神経の求心路**で、ヒトで実際に試された唯一の経路が**迷走神経刺激（VNS）**。ところがエビデンスに基づく総説の整理では、**VNSは日中の眠気を「減らす」**側に置かれている（同じ総説でケトン食は徐波睡眠を増やす側）。だから「延髄の近くを刺激すればノンレムが増える」は、機序としては筋が通っても**ヒトで出ている結果は逆向き**。", "keys": ["パラフェイシャルゾーン", "PZ"]}, {"cat": "解剖・核と経路", "term": "視床網様核", "en": "thalamic reticular nucleus (TRN)", "def": "NREMで紡錘波を作り、感覚の門を閉じる。だから深い眠りでは物音に気づかない。", "keys": ["視床網様核"]}, {"cat": "解剖・核と経路", "term": "島皮質（insular cortex）", "en": "", "def": "**皮質の一領域**（回路の名前ではなく、解剖の場所）。側頭葉と前頭葉の間、シルビウス溝の奥に埋まっていて、外から見えない。体の内側の情報（温度・痛み・かゆみ・内臓・呼吸）が視床を経て**後ろのほう**に入り、**前のほう**で「それは自分にとって重要か」に変換される。前部島皮質＋背側ACC＝サリエンスネットワーク。\n🔴 **睡眠を作る核ではない。** 睡眠の話で出てくるのは、入眠に必要な「注意を外へ手放す」を**邪魔する側**。不眠の人では前部島皮質がサリエンスネットワークと過剰に協働し、その活動が脳波のガンマ帯（覚醒の指標）と相関し、負の感情と結びついていた（fMRIとEEGの同時計測・女性17人＋17人・安静時と入眠を試みているとき）。原著は「島皮質は**身体の状態と時間を統合している**ので、覚醒のネットワークの中で過剰に働くと、**睡眠の質の誤認**と主観的な苦痛の基盤になりうる」と書いている。MRI研究の系統的レビューでも島皮質と前部帯状皮質が一貫して出て、島皮質は不眠症状の**重症度の指標**になっていた。右の前部島皮質の活動上昇は不眠に特異的で、不安と抑うつの重症度を回帰しても残る（N=24＋37＋51）。\n※ 注意の向き先がそのままこの回路の負荷になる、というのは本WSの**読み方**。「内向きにすると悪化する」を直接示した介入研究はまだない。", "keys": ["島皮質"]}, {"cat": "解剖・核と経路", "term": "サリエンスネットワーク", "en": "salience network", "def": "**回路の名前**（物質でも核でもない）。安静にしているときの脳の、離れた場所どうしの活動が一緒に上下する ── そのまとまりの1つ。**前部島皮質と背側ACC**が軸で、扁桃体・視床下部・腹側線条体ともつながる。仕事は「**いま、どれが重要か**」を決めて、注意を内向き⇄外向きに振ること。🔴 **内受容の中枢と同じ場所**なので、体の内側を感じる訓練は、そのまま注意のスイッチを触ることになる。本WSの理論の背骨。🔴 **考える回路（実行制御ネットワーク）とは別物**で、課題をやらせずに安静時のつながりだけを見ても、この2つは別々のまとまりとして出てくる。※「ネットワーク」は解剖の区画ではなく、活動の相関から出てきた統計的なまとまり。境界は解析の仕方で少し動く。", "keys": ["サリエンスネットワーク"]}, {"cat": "解剖・核と経路", "term": "実行制御ネットワーク（executive-control network）", "en": "executive-control network", "def": "**回路の名前**。背外側前頭前野と頭頂の外側を結ぶまとまり。段取り・作業記憶・切り替えといった「考える仕事」の側。サリエンスネットワークと**対になる相手**として出てくる。🔴 大事なのは**交差しないこと**：不安の強さは背側ACC側とだけ対応し、こちらとはどこも対応しない。逆に段取りの成績はこちらとだけ対応し、サリエンス側とはどこも対応しない。**だから不安に「考え方を変えましょう」が届きにくい** ── 不安が乗っているのは、考える回路ではない。", "keys": ["実行制御ネットワーク", "executive-"]}, {"cat": "解剖・核と経路", "term": "ARAS（上行性覚醒系）", "en": "ascending reticular activating system (ARAS)", "def": "脳幹から2ルート（背側＝視床経由／腹側＝視床下部・前脳基底部経由）で皮質を起こす配線。二重化されている。\n🔴 **なぜ感覚刺激で目が覚めるのか**：ARASは周囲の感覚路から**側枝（collateral）**を受けていて、感覚の信号はまずARASを活性化し、そこから皮質を覚醒させる。脳幹で長い上行性の感覚路を切っても、覚醒の脳波反応は起こる（Moruzzi & Magoun 1949。本WSは教科書経由で引いている）。だから**新しい・強い・痛い入力は覚醒側**に働く ── 朝の洗顔や歯磨きが朝に合っているのはこれ。🔴 ただし「脳幹＝全部覚醒系」ではない（→ パラフェイシャルゾーン）。", "keys": ["ARAS", "上行性覚醒系"]}, {"cat": "解剖・核と経路", "term": "RHT（網膜視床下部路）", "en": "retinohypothalamic tract (RHT)", "def": "ipRGC → SCN。グルタミン酸＋PACAP。光同調の本線で、SCNに届く唯一の直接的な外界入力。", "keys": ["RHT", "網膜視床下部路"]}, {"cat": "解剖・核と経路", "term": "GHT（膝状体視床下部路）", "en": "geniculohypothalamic tract (GHT)", "def": "IGL → SCN。NPY／GABA。非光性（運動・覚醒・新奇性）同調の経路。", "keys": ["GHT", "膝状体視床下部路"]}, {"cat": "解剖・核と経路", "term": "IGL（中間膝状葉）", "en": "intergeniculate leaflet (IGL)", "def": "外側膝状体の一部。非光性の位相シフトを中継する。両側破壊で覚醒由来の位相シフトが消える。", "keys": ["IGL", "中間膝状葉"]}, {"cat": "解剖・核と経路", "term": "ipRGC", "en": "intrinsically photosensitive retinal ganglion cell", "def": "メラノプシンを持つ網膜神経節細胞。明るさそのものを検出してSCNへ送る。", "keys": ["ipRGC"]}, {"cat": "解剖・核と経路", "term": "側坐核シェル", "en": "nucleus accumbens shell (NAc shell)", "def": "**側坐核（nucleus accumbens）は腹側線条体の一部**で、報酬・動機づけ・「やる気が入る」を担う回路。正中よりやや外側にあり、正中の断面には写らない。**シェル（殻）とコア（芯）**という2つの部分に分かれていて、外側の層がシェル。🔴 カフェインの覚醒作用は**このシェルのA2A受容体に依存する**。マウスの遺伝子欠損とラットのRNAiの2つの手法で一致した。**コアや大脳基底核の他の場所からA2Aを外しても、カフェインの覚醒作用は変わらなかった。**つまりカフェインの覚醒は青斑核やTMNを叩いているのではなく、**動機・運動の回路を動かしている**。「やる気が入る」に近い、という言い方になるのはこのため。", "keys": ["側坐核シェル"]}, {"cat": "解剖・核と経路", "term": "嗅球・僧帽細胞", "en": "olfactory bulb / mitral cell", "def": "嗅覚の一次中継。血圧拍動が機械感受性チャネルを介して直接ここを変調する（ラット）。", "keys": ["嗅球・僧帽細胞"]}, {"cat": "解剖・核と経路", "term": "松果体", "en": "pineal gland", "def": "SCNの指令で夜にメラトニンを出す。暗さのホルモン工場。", "keys": ["松果体"]}, {"cat": "伝達物質・受容体", "term": "オレキシン（ヒポクレチン）", "en": "orexin / hypocretin", "def": "視床下部の外側にあるニューロンが作る**神経ペプチド**（アミノ酸が連なった伝達物質）。🔴 **溜まる物質ではない。** アデノシンのように蓄積するのではなく、そのニューロンが**発火したときに出る**。発火するのは主に覚醒中なので、覚醒中は出続けて睡眠中は出ない。**残高ではなく、スイッチを押している手**。受容体は2つともすべて興奮性で、小脳以外のほぼ全脳へ投射する。🔴 **覚醒側だけを押す**が、失うと**両方向**に崩れる（シーソーの谷が浅くなるから）。🔴 エネルギー状態を見ている ── **血糖とレプチンで抑制され、グレリンで興奮する**。空腹だと覚醒が上がる。", "keys": ["オレキシン", "ヒポクレチン"]}, {"cat": "伝達物質・受容体", "term": "ヒスタミン", "en": "histamine", "def": "モノアミン系の神経伝達物質。**脳内でこれを作る細胞体はTMN（結節乳頭核）だけ**で、そこから広く投射して覚醒を保つ。アレルギーで問題になるヒスタミンと**同じ分子**で、体では肥満細胞などが出す。だから花粉症の薬（H1をふさぐ抗ヒスタミン薬）を飲むと眠くなる ── 鼻に効かせたい薬が、脳の覚醒側も止めてしまう。新しい世代の薬が眠くなりにくいのは、脳へ入りにくく作られているから。", "keys": ["ヒスタミン"]}, {"cat": "伝達物質・受容体", "term": "神経修飾物質（neuromodulator）", "en": "neuromodulator", "def": "ニューロンの働きを変えるが、**古典的な神経伝達物質の条件を満たさない**もの。アデノシンが代表例。睡眠で出てくる伝え手を3つに分けると違いが見える。\n**①アミノ酸系（グルタミン酸・GABA）**：軸索終末で作られ、シナプス小胞に貯め、発火で放出。シナプスの中だけ。ミリ秒。\n**②神経ペプチド（オレキシン・ガラニン）**：細胞体で作られ、発火で放出。シナプスの外へも出て拡散する。秒〜分。\n**③アデノシン**：🔴 **貯めない・発火で放出されない。** ATPが分解されてできて、細胞の外に溜まる。濃度そのものが信号。\n🔴 ①と②は「いま何が起きているか」を伝え、③は「**どれだけ続いたか**」を伝える。だから睡眠圧はアデノシンでなければ務まらない。\n🔴 **どう効くか＝閾値を押し上げるのではなく「利得」を変える。** 古典的な神経伝達物質は、シナプスの隙間で受け取られて**イオンのチャネルを直接開ける**（ミリ秒）。修飾物質は**代謝調節型受容体（GPCR）**を介して細胞の中のシグナルを回し、**同じ入力に対する反応の大きさ**を秒〜分の単位で変える。しかもシナプスの外へ出て細胞外の空間を拡散して効く ── これを**volume transmission**と呼ぶ。教科書の書き方では「可溶性の因子は高親和性・低親和性の受容体に作用し、volume transmissionで局所に働く。その役割は主に**神経活動の modulation**にあると考えられている」。", "keys": ["神経修飾物質", "neuromodulator"]}, {"cat": "伝達物質・受容体", "term": "神経ペプチド（neuropeptide）", "en": "neuropeptide", "def": "🔴 **「ペプチド」と「神経伝達物質」は、比べる軸が違う言葉。** **神経伝達物質は〈役割〉の名前**（ニューロンが出して他の細胞に伝える物質）、**ペプチドは〈分子の形〉の名前**（アミノ酸が数個〜数十個つながったもの）。だから**ペプチドである神経伝達物質**が存在し、それを神経ペプチドと呼ぶ。オレキシン・ガラニン・ダイノルフィン・MCHがこれ。アミノ酸系（グルタミン酸・GABA）との違いは3つ ── ①**放出がシナプスの中に限られない**（外へも出る）②**放出後に少し離れたところまで拡散して効く** ③**受容体はGPCRで、効きが遅く長い**。アミノ酸系はミリ秒、ペプチドは秒〜分。🔴 オレキシンが全脳を押し上げられるのは、この**拡散して効く**性質が効いている。", "keys": ["神経ペプチド", "neuropeptide"]}, {"cat": "伝達物質・受容体", "term": "グレリン（ghrelin）", "en": "ghrelin", "def": "**胃から出るホルモン**。空腹のときに増え、脳に「食べろ」と伝える。**食欲を上げる側**。🔴 睡眠との関係では、**オレキシンニューロンを興奮させる**。つまり**空腹だと覚醒が上がる** ── 食べ物を探しに動く必要があるので、起きていなければならない、という理屈。🔴 **寝不足になるとグレリンが増える**方向に動くことが知られており、寝不足で食欲が乱れる話につながる。", "keys": ["グレリン", "ghrelin"]}, {"cat": "伝達物質・受容体", "term": "レプチン（leptin）", "en": "leptin", "def": "**脂肪細胞から出るホルモン**。体に蓄えが十分あるときに増え、脳に「足りている」と伝える。**食欲を下げる側**。グレリンとちょうど逆。🔴 睡眠との関係では、**オレキシンニューロンを抑制する**（血糖も同じく抑制する）。満腹なら休んでよいので覚醒を押す必要がない、という向き。オレキシンニューロンはこうしてエネルギー状態を読んでおり、**摂食と覚醒の交差点**にいる。", "keys": ["レプチン", "leptin"]}, {"cat": "伝達物質・受容体", "term": "ドパミン（dopamine）", "en": "dopamine", "def": "モノアミン系の神経伝達物質。**報酬・動機づけ・運動の開始**に関わる。睡眠の話で出てくるのは2か所 ── **腹側被蓋野（VTA）**から側坐核へ向かう回路（カフェインの覚醒がここで実行される）と、**むずむず脚**（ドパミン作動薬が効くが、長期でaugmentation＝症状の重篤な悪化を起こしうる）。🔴 「やる気が入る」という体感は、この系が動いているときの感じ方に近い。", "keys": ["ドパミン", "dopamine"]}, {"cat": "伝達物質・受容体", "term": "グルタミン酸（glutamate）", "en": "glutamate", "def": "**脳でいちばん多い興奮性の神経伝達物質**。GABAのちょうど逆で、相手を発火しやすくする。アミノ酸ひとつなので速い。睡眠では、SCNが松果体へ指令を送る経路や、REMを起こすSLDが使っている。🔴 脳の配線は基本的に**グルタミン酸（アクセル）とGABA（ブレーキ）**で組まれていて、ペプチドやモノアミンは、その上から効き方を調整する側に回る。", "keys": ["グルタミン酸", "glutamate"]}, {"cat": "伝達物質・受容体", "term": "背側ACC（dACC, dorsal anterior cingulate cortex）", "en": "dorsal anterior cingulate cortex (dACC)", "def": "帯状回の前のほう、脳梁のすぐ上を走る皮質。**島皮質と組んでサリエンスネットワークを作る**。「今どれが重要か」を決めて、注意を内向き⇄外向きに振る側。🔴 撮影前に測った**不安の高さと、この背側ACC側の結合が相関した**（実行制御のネットワークとは相関しなかった）。しかも**逆も成り立つ**：段取りの成績のほうは実行制御ネットワークとだけ相関し、この回路とは相関しなかった。🔴 **きれいに分かれている（二重解離）**。つまり不安と、注意の切り替えと、内受容が同じ回路の上に乗っていて、**考える回路の上には乗っていない**。", "keys": ["背側ACC", "dACC"]}, {"cat": "伝達物質・受容体", "term": "GABA／ガラニン", "en": "gamma-aminobutyric acid (GABA) / galanin", "def": "VLPOが消灯するときに一緒に出す2つ。**どちらも神経伝達物質**だが、分子の種類が違うので効き方が違う。**GABAはアミノ酸ひとつ**で、脳でいちばん多い抑制性の伝達物質。イオンチャネル型の受容体を通すので**速く効いて速く切れる**。**ガラニンはアミノ酸が連なったペプチド**（＝神経ペプチド）。GPCRを通すので**遅く効いて長く続き**、シナプスの外へも広がる。つまり**速攻と持続の組み合わせ**で、スイッチを倒してから倒れたまま保つのに向いている。", "keys": ["GABA／ガラニン", "GABA", "ガラニン"]}, {"cat": "伝達物質・受容体", "term": "アデノシン", "en": "adenosine", "def": "🔴 **ホルモンでもなく、古典的な神経伝達物質でもない。** 分類は**神経修飾物質（neuromodulator）**。原著の表現では「**小胞に貯められて放出されるのでも、古典的な神経伝達物質のように放出されるのでもなく**、細胞の中か表面で**アデニンヌクレオチド（ATPなど）が分解されて**できる」。つまり**エネルギーを使った跡に残るもの**。ATPの「アデノシン」と同じ分子で、脳だけでなく心臓や腎臓など全身の細胞にある（カフェインに体の作用が出るのはこのため）。🔴 **ここが決定的に効く。** 発火に応じて放出される物質は「**今この瞬間の活動**」しか伝えられない。アデノシンは放出ではなく**溜まる**ので、「**どれだけ長く活動し続けたか**」という**時間の積算**を伝えられる。だからプロセスS（睡眠圧）の実体になれる。オレキシンが溜まらないのと、ちょうど対になる。細胞外の濃度は**長く起きているほど皮質と前脳基底部で上がり、眠って回復すると下がる**。", "keys": ["アデノシン"]}, {"cat": "伝達物質・受容体", "term": "A1受容体／A2A受容体", "en": "adenosine A1 / A2A receptor", "def": "アデノシンの受容体。**A1は主に抑制性**で覚醒を作るニューロンを抑える。**A2Aは興奮性**で、VLPOの睡眠ニューロン（Type-2）を直接興奮させる側と、側坐核シェルで覚醒を作る側の両方にある。**A1もA2Aも入眠に関わる**。カフェインは非選択的なので両方を塞ぐが、🔴 **覚醒作用そのものはA2A依存**で、遺伝子改変マウスで確かめられている。🔴 **A1は部位によって働きが逆になる** ── 覚醒促進ニューロンを抑える一方で、**外側視索前野でA1を活性化すると覚醒が起きる**。「A1＝眠くなる側」と単純化できない。", "keys": ["A1受容体／A2A受容体", "A1受容体", "A2A受容体"]}, {"cat": "伝達物質・受容体", "term": "メラトニン", "en": "melatonin", "def": "松果体が夜に出す時刻信号。「眠れ」の命令ではない。だから量より時刻が効く（最適は4mg・就寝3時間前）。", "keys": ["メラトニン"]}, {"cat": "伝達物質・受容体", "term": "ダイノルフィン", "en": "dynorphin", "def": "オレキシンニューロンがほぼ全て併せ持つペプチド。TMNへのGABA入力を抑えて脱抑制する。", "keys": ["ダイノルフィン"]}, {"cat": "伝達物質・受容体", "term": "機械感受性イオンチャネル", "en": "mechanosensitive ion channel", "def": "**引っぱられたり押されたりという物理的な力で開く**イオンチャネル。化学物質（伝達物質）で開く普通の受容体とは、開くきっかけが違う。触覚や聴覚、血圧のセンサーがこの仕組みで働いている。🔴 だから**シナプスを1つも介さずに**、力がそのまま電気の変化になる。血圧の拍動が嗅球のニューロンを20ミリ秒以内に引き込んでいた、というのはこの経路の話。", "keys": ["機械感受性イオンチャネル"]}, {"cat": "伝達物質・受容体", "term": "cAMP", "en": "cyclic adenosine monophosphate (cAMP)", "def": "環状アデノシン一リン酸。**細胞の外で受容体が受け取った合図を、細胞の中へ伝え直す「二番目の伝令」**（セカンドメッセンジャー）。受容体そのものは膜にあって中に入れないので、代わりにこれが増えたり減ったりして中の反応を動かす。Gs型の受容体は増やし、**Gi型（MT1・MT2など）は減らす**。時計細胞の中核部品でもあり、カフェインはここに直接届いて概日周期を伸ばす。", "keys": ["cAMP"]}, {"cat": "伝達物質・受容体", "term": "MT1受容体（melatonin receptor 1）", "en": "melatonin receptor 1 (MT1)", "def": "メラトニンの受容体のひとつ。Gi型で**cAMPを下げる**。**青斑核・外側視床下部**などREM側と覚醒側にある。欠損マウスでは**NREMが増えてREMが減る**。概日リズムの調節にも関わる。", "keys": ["MT1受容体"]}, {"cat": "伝達物質・受容体", "term": "MT2受容体（melatonin receptor 2）", "en": "melatonin receptor 2 (MT2)", "def": "もうひとつのメラトニン受容体。**視床網様核（RT）**にあり、**NREMを増やす**側。部分作動薬でRT細胞がバースト発火に切り替わり、欠損マウスでは**NREMが減る**。🔴 **MT1とMT2は逆を向いている**。素のメラトニンは両方に効くので打ち消し合い、これが「睡眠薬としては弱い」の機序的な説明になる。", "keys": ["MT2受容体"]}, {"cat": "伝達物質・受容体", "term": "徐放型メラトニン（PRM, prolonged-release melatonin）", "en": "prolonged-release melatonin (PRM)", "def": "ゆっくり溶けるように作ったメラトニン製剤（Circadin 2mg・55歳以上に適応）。素のメラトニンは**半減期40〜60分**で深夜には血中に残らないため、中途覚醒を狙うなら理屈が通るのはこちら。🔴 ただし主要RCTの著者に**製造元 Neurim Pharmaceuticals** が入っている。効果量は割り引いて読む。", "keys": ["徐放型メラトニン", "PRM", "prolonged-"]}, {"cat": "状態・現象", "term": "フリップフロップ", "en": "flip-flop switch", "def": "もともと**電子回路の用語**で、2つの安定した状態しか取らず、中間に留まれない回路のこと。覚醒系と睡眠系が**互いに抑え合う**ように繋がっていると、この性質が自然に出る ── 片方が優勢になると相手をさらに抑えるので、優勢な側へ一気に振り切れる。だから眠りは「だんだん」ではなく**ある瞬間に落ちる**。🔴 押す力（オレキシン）が弱ると谷が浅くなり、**どちらの状態にも留まれなくなる**（＝両方向の分断）。", "keys": ["フリップフロップ"]}, {"cat": "状態・現象", "term": "上の閾値H／下の閾値L（upper threshold H / lower threshold L）", "en": "upper threshold (H) / lower threshold (L)", "def": "2プロセスモデルで、睡眠圧Sが行き来する2本の線の正式な呼び名。**H は High、L は Low**。**SがHに届くと入眠**し、**Lまで下がると覚醒**する。🔴 この2本の線そのものが**概日（プロセスC）で上下している**ので、同じだけ眠気が溜まっていても、時刻が違えば落ちるか落ちないかが変わる。昼の2時にどれだけ眠くても夜11時ほどは落ちないのは、Hがまだ高いから。", "keys": ["上の閾値H／下の閾値L", "上の閾値H", "下の閾値L"]}, {"cat": "状態・現象", "term": "プロセスC", "en": "Process C — circadian process", "def": "🔴 **C は Clock ではなく Circadian（概日）**。原著の言い方は「**概日ペースメーカーに制御された過程**」。SCNが刻み、光で同調する。溜まり方と無関係に、**時刻**で上下する。**位相（タイミング）の話**。Sが「どれだけ溜まったか」なら、Cは「いま何時か」。この2つは足し算ではなく、絶えず影響し合っている。", "keys": ["プロセスC"]}, {"cat": "状態・現象", "term": "プロセスS", "en": "Process S — homeostatic sleep pressure", "def": "**S は Sleep**。原著の言葉では **sleep-regulating variable（睡眠を調節する変数）**。起きている間に増え、眠ると減る量そのもの＝睡眠圧。**量の話**。🔴 1984年の原著は「**おそらく、ただし必ずしもそうとは限らないが**、何らかの神経化学物質と結びついている」と書いており、**Sが何の物質かは決めていなかった**。いまはアデノシンが最有力候補。つまり S はもともと**物質の名前ではなく、モデルの上の変数**。", "keys": ["プロセスS"]}, {"cat": "状態・現象", "term": "NREM／REM", "en": "non-rapid eye movement / rapid eye movement sleep", "def": "NREM＝徐波と紡錘波で脳がクールダウン。REM＝皮質は活性だが体は脱力。", "keys": ["NREM／REM", "NREM", "REM"]}, {"cat": "状態・現象", "term": "逆説睡眠", "en": "paradoxical sleep", "def": "REMの別名。皮質は起きているように動いているのに体は動かない、上下で逆のことが起きている状態。", "keys": ["逆説睡眠"]}, {"cat": "状態・現象", "term": "アトニア", "en": "muscle atonia (REM atonia)", "def": "REM中の骨格筋の脱力。脳が能動的に脊髄運動ニューロンを止めている安全装置。", "keys": ["アトニア"]}, {"cat": "状態・現象", "term": "カタプレキシー", "en": "cataplexy", "def": "🔴 強い情動で起こる短時間の筋の脱力。アトニアが覚醒中に漏れ出た状態。**意識は保たれる**（「意識が飛ぶ」なら別の病態）。オレキシン欠乏のマーカー。", "keys": ["カタプレキシー"]}, {"cat": "状態・現象", "term": "睡眠発作", "en": "sleep attack", "def": "意思に反して眠りへ滑り込む発作。ナルコレプシーの主症状。", "keys": ["睡眠発作"]}, {"cat": "状態・現象", "term": "マイクロスリープ", "en": "microsleep", "def": "数秒の意識の途切れ。重度の睡眠不足や睡眠時無呼吸でも起こる（ナルコレプシー特有ではない）。", "keys": ["マイクロスリープ"]}, {"cat": "状態・現象", "term": "ナルコレプシー1型", "en": "narcolepsy type 1 (NT1)", "def": "オレキシンニューロンが約9割失われる。日中の眠気だけでなく夜間睡眠も分断される＝両方向に壊れる。", "keys": ["ナルコレプシー1型"]}, {"cat": "状態・現象", "term": "PLM（周期性下肢運動）", "en": "periodic limb movements in sleep (PLMS)", "def": "睡眠中に脚が周期的に動く。むずむず脚の多くが伴い、これが睡眠を分断する。本人は気づかない。", "keys": ["PLM", "周期性下肢運動"]}, {"cat": "状態・現象", "term": "オルソソムニア（orthosomnia）", "en": "orthosomnia", "def": "**状態につけられた名前**（病名ではない）。ギリシャ語の ortho＝正しい ＋ somnia＝眠り。2017年に症例報告で命名された。**睡眠トラッカーが出す「正しい睡眠」の数字を追い求めた結果、かえって眠れなくなる**状態。端末が「浅い睡眠が多い」と表示するのを見て、自分で睡眠障害だと判断して受診する人が増えている。🔴 **やっかいなのは、本人にとって端末の数字のほうが、睡眠ポリグラフより実感に合うと感じられること**（原著が明記）。だから数字を否定しても納得しない。🔴 **原著の推奨は「取り上げる」ではなく「CBT-Iに組み込む」**。※装置の当たり具合は機種で激しく違う（睡眠段階で0.26〜0.69・1.0が完全一致）。", "keys": ["オルソソムニア", "orthosomnia"]}, {"cat": "状態・現象", "term": "augmentation（オーグメンテーション）", "en": "augmentation", "def": "むずむず脚でドパミン作動薬を長期使用したときに起こる、症状の重篤な悪化。初期はよく効くのが厄介。", "keys": ["augmentation", "オーグメンテーション"]}, {"cat": "状態・現象", "term": "位相反応曲線（PRC）", "en": "phase-response curve (PRC)", "def": "刺激を与えた時刻ごとに、時計がどちら向きにどれだけずれるかを描いた曲線。光にも運動にもある。", "keys": ["位相反応曲線", "PRC"]}, {"cat": "状態・現象", "term": "位相前進／位相後退", "en": "phase advance / phase delay", "def": "時計の針が早まる／遅れる。朝の光と午後の運動は前進、夜の光と夜遅い運動・カフェインは後退。", "keys": ["位相前進／位相後退", "位相前進", "位相後退"]}, {"cat": "状態・現象", "term": "entrain（引き込み）", "en": "entrainment", "def": "外部のリズムに内部のリズムが同期すること。心拍が嗅球ニューロンを約20msで引き込む例がある。", "keys": ["entrain", "引き込み"]}, {"cat": "状態・現象", "term": "内受容覚", "en": "interoception", "def": "心拍・呼吸・内臓など体の内側を感じる感覚。中枢は島皮質。", "keys": ["内受容覚"]}, {"cat": "状態・現象", "term": "内受容の正確さ／感受性", "en": "interoceptive accuracy / interoceptive sensibility", "def": "正確さ＝実際に信号を検出できる客観的な能力。感受性＝自分は分かるという主観的な自己評価。🔴 睡眠が悪い人は注意の量は増え、正確さは下がる。", "keys": ["内受容の正確さ／感受性", "内受容の正確さ", "感受性"]}, {"cat": "状態・現象", "term": "覚醒閾値", "en": "arousal threshold", "def": "どれだけの刺激で目が覚めるか。無呼吸の4形質の1つ。低い人はすぐ起きるので分断が主症状になる。", "keys": ["覚醒閾値"]}, {"cat": "状態・現象", "term": "ループゲイン", "en": "loop gain", "def": "呼吸調節の不安定さ。高いと呼吸が振動して無呼吸を起こしやすい。", "keys": ["ループゲイン"]}, {"cat": "状態・現象", "term": "AHI（無呼吸低呼吸指数）", "en": "apnea–hypopnea index (AHI)", "def": "1時間あたりの無呼吸・低呼吸の回数。舌咽の運動療法で約50%減るが、24.5→12.3でまだ残る。", "keys": ["AHI", "無呼吸低呼吸指数"]}, {"cat": "状態・現象", "term": "徐波／睡眠紡錘波", "en": "slow waves / sleep spindles", "def": "徐波＝NREMのゆっくり大きな脳波（前頭前野が主な発生源）。紡錘波＝視床網様核が作る短い束。", "keys": ["徐波／睡眠紡錘波", "徐波", "睡眠紡錘波"]}, {"cat": "状態・現象", "term": "脳波（EEG）", "en": "electroencephalogram (EEG)", "def": "頭皮から測る**電位の合計**。1個の細胞の活動ではなく、何千万個ぶんが重なったものを見ている。🔴 **材料は主にシナプス電流で、活動電位（発火）ではない。** 発火は2ms未満と短すぎて、生理的な状態では同じ瞬間に何万個も重なることがまず起きないので、足し算にならない。だから**揃っているのは膜電位**であって、発火ではない。振幅を決めるのは①細胞の並び方 ②膜電位の同期の2つで、活動の量ではない。🔴 その結果、**大きな波は、強い発火とも、中程度の発火とも、発火ゼロとも一緒に起こりうる**（原著の記述）。時間分解能はミリ秒だが空間分解能は粗く、SCNやTMNのような小さな核は頭皮の脳波には出ない。なお**発火の同期が出るのは100Hzより上の帯域**で、そこは発火の代理指標として使える。", "keys": ["脳波", "EEG"]}, {"cat": "状態・現象", "term": "同期／脱同期（synchronization / desynchronization）", "en": "synchronization / desynchronization", "def": "🔴 **揃っているのは膜電位であって、発火ではない。** 多数のニューロンの膜電位が同じタイミングで上下しているかどうか。揃えば足し算になって**高振幅・徐い**波になり（深いNREM）、バラバラなら打ち消し合って**低振幅・速い**波になる（覚醒・REM）。覚醒の脳波が小さいのは活動が少ないからではなく、**揃っていない**から。小脳は構造としては完璧に整っているのに脳波がほとんど出ない ── 計算がローカルで済んで、**揃う必要がない**から。これが「構造が良くても揃わなければ出ない」の証拠。", "keys": ["同期／脱同期", "synchronization", "desynchronization", "同期", "脱同期"]}, {"cat": "状態・現象", "term": "局所睡眠（local sleep）", "en": "local sleep", "def": "**脳全体が一斉に眠るわけではなく、皮質の一部だけが先に活動を止める**現象。長く起きているほど頻度が増える。ラットでは、行動の上では起きていて脳波も覚醒を示しているのに、ある皮質領域のニューロンだけが睡眠中と同じように発火を止めていた。別の領域は起きたままなので、**同じ脳の中で起きている場所と寝ている場所が同居する**。🔴 その間、砂糖ペレットを取る課題の成績が段階的に落ちた。**寝不足のときに、起きているのに手元が狂ったりミスが増えたりするのはこれ。**フリップフロップが「中間に留まれない」のは、あくまで**ひとつの神経集団の中での話**で、脳全体が同時にパチンと切り替わるという意味ではない。\n🔴 **ヒトでも起きる。しかも「使った場所」に出る。** 特定の脳領域を使う運動学習をやらせると、**その領域だけ**徐波活動が上がり、その局所的な上昇が、翌日の課題成績の向上と相関した（Nature 2004）。つまり睡眠圧は全脳一律の借金ではなく、**使った回路のローカルな借金**。だから体を動かしていなくても、頭を使えば睡眠圧は溜まる。\n※ ただし「使った量＝溜まった量」と代謝だけで読むのは早い。同じデータは**シナプスの後始末**（使ったぶんだけ整理が要る）としても説明でき、どちらか決着していない。", "keys": ["局所睡眠"]}, {"cat": "状態・現象", "term": "ダウンステート／アップステート（down state / up state）", "en": "down state / up state", "def": "深いNREMで皮質の錐体細胞の膜電位が0.5〜1.5Hzで行き来する2つの状態。アップ＝脱分極して発火、**ダウン＝過分極して黙る**。この上下が層をまたぐ電流の流れを作り、大きな波になる。🔴 だから**徐波（デルタ波）が大きいのは、揃って黙っている時間があるから**。大きい波＝活発、ではない。同じことが別の理由でも起きる ── **強い抑制がかかると、抑制性のシナプス電流は流れるので波は大きくなるのに、その抑制のせいで発火は止められる。**", "keys": ["ダウンステート／アップステート", "ダウンステート", "アップステート"]}, {"cat": "状態・現象", "term": "局所電位（LFP, local field potential）", "en": "local field potential (LFP)", "def": "脳の中に electrode を入れて測る同じ種類の信号。頭皮で測れば脳波（EEG）、皮質表面ならECoG、脳内ならLFPと呼び分けるだけで、正体は同じ。", "keys": ["局所電位", "LFP"]}, {"cat": "状態・現象", "term": "逆問題（inverse problem）", "en": "inverse problem", "def": "見えている脳波から、それを作った細胞レベルの出来事を逆算する問題。🔴 **同じ形の脳波が、まったく別の細胞イベントから生じうる**ので、原理的に一意には解けない。「脳波がこう出ているからこの部位が働いている」とは言えない理由。", "keys": ["逆問題"]}, {"cat": "状態・現象", "term": "中途覚醒（WASO, wake after sleep onset）", "en": "wake after sleep onset (WASO)", "def": "入眠したあと、朝までの間に目が覚めている時間の合計。本WSの型③。🔴 前半は**プロセスS**が睡眠を支えているが、後半はSを使い切るので**プロセスCが支える**。強制脱同調の研究でCとSの寄与はほぼ同等と分かっており、中途覚醒は**後半のCの弱さ**として読める。", "keys": ["中途覚醒", "WASO"]}, {"cat": "サプリ・食品・デバイス", "term": "アシュワガンダ", "en": "ashwagandha (Withania somnifera)", "def": "インドの伝統医学アーユルヴェーダのハーブ（Withania somnifera）。欧米では**アダプトゲン**＝ストレス耐性を高めるサプリとして広く売られている。不安 SMD −1.55／ストレス −1.75 と数字は大きいが 🔴 **確実性は低・I²は83〜94%**。睡眠にも SMD −0.59。🚫 **肝障害の症例報告があり、肝疾患既往の3例が死亡している**。", "keys": ["アシュワガンダ"]}, {"cat": "サプリ・食品・デバイス", "term": "アダプトゲン", "en": "adaptogen", "def": "ストレスへの適応力を高めるとされるハーブの総称。規制上の定義や合意された作用機序はない**マーケティング用語**寄りの概念。", "keys": ["アダプトゲン"]}, {"cat": "サプリ・食品・デバイス", "term": "エプソムソルト／経皮マグネシウム", "en": "Epsom salt / transdermal magnesium", "def": "硫酸マグネシウムの入浴剤やスプレー。🔴 レビュー結論は「経皮マグネシウムの宣伝は科学的に支持されない」。皮膚から意味のある量は入らない。**経口は別で、入眠潜時 −17.4分の根拠がある**。", "keys": ["エプソムソルト／経皮マグネシウム", "エプソムソルト", "経皮マグネシウム"]}, {"cat": "サプリ・食品・デバイス", "term": "プロバイオティクス", "en": "probiotics", "def": "生きた菌のサプリ。🔴 睡眠が悪い人と健常者で腸内細菌の多様性に差がなく、PSQI（主観）だけ改善してESS（客観的な眠気）は動かない。", "keys": ["プロバイオティクス"]}, {"cat": "サプリ・食品・デバイス", "term": "L. gasseri CP2305", "en": "Lactobacillus gasseri CP2305", "def": "アサヒの保有菌株。N=60・24週の二重盲検でPSQI・入眠潜時・中途覚醒・デルタ波が改善。企業共著。", "keys": ["L. gasseri CP2305"]}, {"cat": "サプリ・食品・デバイス", "term": "タルトチェリー", "en": "tart cherry (Prunus cerasus)", "def": "メラトニンを含むサクランボの濃縮果汁。N=20のクロスオーバーRCTで尿中メラトニン増と睡眠時間・効率の改善。極小サンプル。", "keys": ["タルトチェリー"]}, {"cat": "サプリ・食品・デバイス", "term": "キウイフルーツ", "en": "kiwifruit (Actinidia)", "def": "🔴 有名な研究は**対照群が存在しない自己対照デザイン**（N=24・男性2人）。プラセボと平均への回帰を分離できていない。", "keys": ["キウイフルーツ"]}, {"cat": "サプリ・食品・デバイス", "term": "バレリアン", "en": "valerian (Valeriana officinalis)", "def": "西洋カノコソウ。60研究で主観的な睡眠質を改善。重篤な有害事象なし。ただし掲載誌と著者の所属に注意。", "keys": ["バレリアン"]}, {"cat": "サプリ・食品・デバイス", "term": "グリシン", "en": "glycine", "def": "非必須アミノ酸。就寝前の摂取で主観的な睡眠質が改善するとされる。🔴 主要研究の出どころが**販売元（味の素）**。", "keys": ["グリシン"]}, {"cat": "サプリ・食品・デバイス", "term": "経口GABA", "en": "oral gamma-aminobutyric acid (GABA)", "def": "γ-アミノ酪酸のサプリ。**飲んで眠気が起きる、という性質のものではない。**14研究の系統的レビュー（レビュー著者はUnilever所属）の結論は「ストレスには**限定的**、睡眠には**ごく限定的**」。🔴 効いたのは**入眠潜時（寝つくまでの時間）だけ**で、**睡眠効率・REM時間・中途覚醒・覚醒回数・デルタ波はどれも有意差なし**。しかも**100〜300mg を1〜4週続けて**の話（ストレス目的の20〜100mgより高用量）。原著は「**寝つかせる方向には効きうるが、眠りを保つ方向には効いていない**」とまとめている。理由の推測として、経口GABAは**30分で血中濃度がピーク、60分で下がる**ので夜の前半しかカバーしないこと。🔴 **「血液脳関門を越えない」は言い過ぎ。** 原著は「長らく越えないと考えられてきたが、少量だけ越えるという報告と相当量が越えるという報告の両方があり、**ヒトで透過性を示したデータは今のところ無い**」と書いている。経口で脳内GABAが増えるのかも**分かっていない**。ただしEEGのアルファ波は動いており、腸管神経系のGABAが**腸脳軸**を通じて末梢から効いている可能性も挙げられている。🔴 **14研究のうち11研究で、著者の1人以上が企業に雇用されていた。**", "keys": ["経口GABA"]}, {"cat": "サプリ・食品・デバイス", "term": "トリプトファン", "en": "L-tryptophan", "def": "セロトニンとメラトニンの原料アミノ酸。≥1gで中途覚醒が短縮。ただし18本集めて解析できたのは4本。", "keys": ["トリプトファン"]}, {"cat": "サプリ・食品・デバイス", "term": "CBD／医療大麻", "en": "cannabidiol (CBD) / medicinal cannabis", "def": "カンナビジオール。🔴 有名なRCTは著者自身が盲検の崩壊を認めており、製品はTHC含有で**日本では違法**。", "keys": ["CBD／医療大麻", "CBD", "医療大麻"]}, {"cat": "サプリ・食品・デバイス", "term": "ホワイトノイズ", "en": "white noise / continuous broadband noise", "def": "一定の広帯域ノイズ。🔴 38研究で GRADE「きわめて低」。著者が「普及度と矛盾する」と明記し、睡眠と聴覚への悪影響の可能性にも触れている。", "keys": ["ホワイトノイズ"]}, {"cat": "サプリ・食品・デバイス", "term": "ブルーライトカット眼鏡", "en": "blue-light filtering spectacle lenses", "def": "🔴 Cochrane 17 RCT。睡眠への効果は判定不能（確実性きわめて低）。眼精疲労にも効果なし。有害事象に抑うつ症状の増加。", "keys": ["ブルーライトカット眼鏡"]}, {"cat": "サプリ・食品・デバイス", "term": "口テープ（マウステーピング）", "en": "mouth taping", "def": "就寝中に口を塞いで鼻呼吸にする方法。🔴 **鼻閉があれば禁忌**（鼻閉自体がAHIを+13.78悪化させる）。鼻が通る人では軽症OSAでAHIが下がった報告が2件。**窒息の症例報告は見つからない＝理論上の懸念**。", "keys": ["口テープ", "マウステーピング"]}, {"cat": "サプリ・食品・デバイス", "term": "アーシング（接地シーツ）", "en": "earthing / grounding", "def": "体を大地に電気的に接続する寝具。🔴 有名な研究はN=12で**対照群なし**の単群前後比較。", "keys": ["アーシング", "接地シーツ"]}, {"cat": "サプリ・食品・デバイス", "term": "重み付きブランケット", "en": "weighted blanket", "def": "重い毛布。不眠でISIが改善（d=1.90）。ただし**重さは本人に分かる＝盲検が成立しない**ので効果量は割り引く。", "keys": ["重み付きブランケット"]}, {"cat": "サプリ・食品・デバイス", "term": "空気圧迫装置", "en": "pneumatic compression device (PCD)", "def": "下肢に周期的な圧をかける装置。むずむず脚に対し**シャム対照の二重盲検**で3分の1が完全消失（シャム群0人）。設計が良い。", "keys": ["空気圧迫装置"]}, {"cat": "サプリ・食品・デバイス", "term": "舌咽の運動療法", "en": "myofunctional therapy", "def": "myofunctional therapy。舌と咽頭の筋トレ。成人でAHIが約50%減（24.5→12.3）。ただし残るので**補助**。", "keys": ["舌咽の運動療法"]}, {"cat": "サプリ・食品・デバイス", "term": "足部加温／靴下", "en": "feet warming / bed socks", "def": "23℃の涼しい環境で就寝時に靴下を履くと入眠潜時 −7.5分。N=6・男性のみ・深部体温は不変。🔴 **暑い環境では放熱を妨げて逆効果になりうる**。", "keys": ["足部加温／靴下", "足部加温", "靴下"]}, {"cat": "サプリ・食品・デバイス", "term": "睡眠制限", "en": "sleep restriction", "def": "CBT-Iの中核技法。寝床にいる時間を実際に眠れている時間まで削って睡眠圧を高める。", "keys": ["睡眠制限"]}, {"cat": "サプリ・食品・デバイス", "term": "刺激制御", "en": "stimulus control", "def": "CBT-Iの中核技法。寝床を「眠る場所」に戻す。眠れないときは寝床から出る。", "keys": ["刺激制御"]}, {"cat": "サプリ・食品・デバイス", "term": "認知リフォーカス（CRT-I）", "en": "cognitive refocusing treatment for insomnia (CRT-I)", "def": "寝る前の思考を、退屈でなく**没入できる内容**に置き換える技法。一般的な「気そらし」は逆効果。", "keys": ["認知リフォーカス", "CRT-I"]}, {"cat": "サプリ・食品・デバイス", "term": "内受容トレ", "en": "interoceptive training", "def": "体の内側の感覚に注意を向ける訓練。鈍麻タイプ向け。🔴 **過敏タイプには入れない**（運用判断）。", "keys": ["内受容トレ"]}, {"cat": "サプリ・食品・デバイス", "term": "クローズドループ音響刺激", "en": "closed-loop acoustic stimulation", "def": "深睡眠の徐波の山にタイミングを合わせて音を鳴らし、徐波と記憶の定着を増強する。位相がズレると無効。", "keys": ["クローズドループ音響刺激"]}, {"cat": "研究の読み方", "term": "系統的レビュー／メタ解析", "en": "systematic review / meta-analysis", "def": "決めた手順で論文を網羅的に集めるのが系統的レビュー。数値を統合するのがメタ解析。単に「レビュー」とだけあるものは著者の選び方が入る。", "keys": ["系統的レビュー／メタ解析", "系統的レビュー", "メタ解析"]}, {"cat": "研究の読み方", "term": "ナラティブレビュー", "en": "narrative review", "def": "網羅の手順を決めずに書いたレビュー。著者の視点が強く入る。単著だとさらに弱い。", "keys": ["ナラティブレビュー"]}, {"cat": "研究の読み方", "term": "RCT", "en": "randomized controlled trial (RCT)", "def": "無作為割付の比較試験。誰がどちらに入るかを偶然で決めることで、集団の偏りを消す。", "keys": ["RCT"]}, {"cat": "研究の読み方", "term": "横断研究", "en": "cross-sectional study", "def": "一時点で測るだけ。相関は出せるが原因と結果の順序は決められない。🔴 「〜すべき」という提言は多くの場合ここから出た著者の考察。", "keys": ["横断研究"]}, {"cat": "研究の読み方", "term": "縦断研究（前向きコホート）", "en": "longitudinal / prospective cohort study", "def": "先に測って後で追いかける。順序が分かるので予測因子の議論ができる。", "keys": ["縦断研究", "前向きコホート"]}, {"cat": "研究の読み方", "term": "シャム対照", "en": "sham-controlled", "def": "偽の介入を対照に置く。装置や手技で本人に介入が分からなくできる場合に強い設計になる。", "keys": ["シャム対照"]}, {"cat": "研究の読み方", "term": "二重盲検", "en": "double-blind", "def": "参加者も評価者もどちらの群か知らない。主観アウトカムでは特に重要。", "keys": ["二重盲検"]}, {"cat": "研究の読み方", "term": "盲検の崩壊", "en": "unblinding / loss of blinding", "def": "途中で本人にどちらか分かってしまうこと。重い毛布・アロマ・運動は原理的に盲検化できない。", "keys": ["盲検の崩壊"]}, {"cat": "研究の読み方", "term": "OR（オッズ比）", "en": "odds ratio (OR)", "def": "起こりやすさの比。1.0で差なし。1.3は小さく、2.6は大きい。", "keys": ["OR", "オッズ比"]}, {"cat": "研究の読み方", "term": "SMD（標準化平均差）", "en": "standardized mean difference (SMD)", "def": "単位の違う尺度を揃えた効果量。0.2で小、0.5で中、0.8で大が目安。", "keys": ["SMD", "標準化平均差"]}, {"cat": "研究の読み方", "term": "MD（平均差）", "en": "mean difference (MD)", "def": "元の単位のままの差。「入眠潜時が17分短い」のような形。", "keys": ["MD", "平均差"]}, {"cat": "研究の読み方", "term": "効果量（Cohen's d）", "en": "effect size — Cohen's d", "def": "群間の差を標準偏差で割ったもの。🔴 主観アウトカムで1.9のような値が出たら、盲検の失敗を疑う。", "keys": ["効果量", "Cohen'"]}, {"cat": "研究の読み方", "term": "I²（異質性）", "en": "I-squared — heterogeneity", "def": "研究間のばらつき。0%は揃っている、80%超は揃っていない＝統合値を信用しにくい。", "keys": ["I²", "異質性"]}, {"cat": "研究の読み方", "term": "GRADE", "en": "Grading of Recommendations Assessment, Development and Evaluation", "def": "エビデンスの確実性を高・中・低・きわめて低で表す枠組み。効果量が大きくても確実性が低いことはある。", "keys": ["GRADE"]}, {"cat": "研究の読み方", "term": "自己対照デザイン", "en": "self-controlled (uncontrolled pre-post) design", "def": "対照群を置かず、同じ人の前後だけを比べる。🔴 プラセボと平均への回帰を分離できない。", "keys": ["自己対照デザイン"]}, {"cat": "研究の読み方", "term": "平均への回帰", "en": "regression to the mean", "def": "調子の悪いときに測った値は、何もしなくても次は良くなりやすいという統計的な性質。", "keys": ["平均への回帰"]}, {"cat": "研究の読み方", "term": "COI（利益相反）", "en": "conflict of interest (COI)", "def": "研究者と結果の間の利害関係。所属だけでは判断せず設計を見る。🔴 自社製品を含む比較を自社が実施しているのは別格に悪い。", "keys": ["COI", "利益相反"]}, {"cat": "研究の読み方", "term": "強制脱同調（forced desynchrony）", "en": "forced desynchrony protocol", "def": "時刻の手がかりを消した環境で、睡眠覚醒周期を24時間から意図的にずらす（例：28時間）実験デザイン。睡眠が体内時計のあらゆる位相で起きるので、**プロセスCとプロセスSの寄与を分離できる**。ヒトで数十日かけて行う大がかりな方法で、その分エビデンスは強い。", "keys": ["強制脱同調"]}, {"cat": "研究の読み方", "term": "位相反応曲線（PRC, phase response curve）", "en": "phase response curve (PRC)", "def": "**同じ刺激でも、与える時刻によって体内時計が前に進むか後ろにずれるかが変わる**ことを示した曲線。光にもメラトニンにも運動にもある。メラトニンでは前進のピークが**DLMOの約5時間前（午後〜夕方）**、後退のピークが**約11時間後（起床直後）**。🔴 **習慣的な睡眠の前半はデッドゾーンで、飲んでも時計はほとんど動かない**。就寝前後に飲むのは「時計を動かす飲み方」ではない。", "keys": ["位相反応曲線", "PRC"]}, {"cat": "研究の読み方", "term": "DLMO（薄暗い光の下でのメラトニン分泌開始）", "en": "dim light melatonin onset (DLMO)", "def": "dim light melatonin onset。暗い環境で唾液や血中のメラトニンが立ち上がる時刻で、**体内時計の位相を測る実質的な標準**。だいたい習慣的な入眠の1〜3時間前に来る。PRCの時刻はこのDLMOを基準に語られる。", "keys": ["DLMO", "薄暗い光の下でのメラトニン分泌開始"]}, {"cat": "研究の読み方", "term": "デッドゾーン（dead zone）", "en": "dead zone (of the phase response curve)", "def": "位相反応曲線の中で、**刺激を与えても時計がほとんど動かない時間帯**。メラトニンでは習慣的な睡眠の前半がこれにあたる。「効いている感じはあるのに時計は動いていない」が起こりうる理由。", "keys": ["デッドゾーン"]}, {"cat": "尺度", "term": "揺れ（rocking・前庭刺激 vestibular stimulation）", "en": "", "def": "🔴 **①何を揺らすのか ── 体ごと、横に平行移動させる。** 研究で**使われた**揺れは、振り子の軌道に沿った**左右の横揺れ**で、**1往復およそ4秒・片側7〜10cm**、ピーク加速度 0.25 m/s²（重力の約40分の1）。頭から足の方向ではない。\n🔴 **ただし「1往復4秒が効く速さ」とは言えない。** 同じ論文（Kompotis 2019）が「効いているのは**加速度の最大値**で、揺れの速さそのものではない」と結論している。**4秒は使われた設定であって、効いた原因ではない。**\n🔴 **ヒトの仮眠の研究で有意だったのは、デルタパワーの立ち上がりが速いことだけ。** abstract が「**眠りの構造は変わらなかった ── 深い眠りの割合も潜時も**」「**以前の報告（N2への潜時・紡錘波の密度）は再現しなかった**」と明記している。\n**②どこで受けているか ── 内耳の耳石器**（直線の加速度を感じる部分。回転を感じる三半規管とは別）。\n🔴 **③なぜ耳石器だと分かるか** ── 耳石を作れない突然変異のマウスは、**揺れにまったく反応しなかった**（野生型と同じ巣で育った兄弟は反応した）。同じ論文が「効いているのは揺れの速さそのものではなく、**加えた直線加速度の最大値**」と結論している。\n🔴 **④スライドでは言えない例外（2つ）**\n・**気持ちよさでは判定できない。** 高齢者19人で「本人が一番快適と答えた設定」で夜どおし揺らしたら、**睡眠は改善せず、深い眠りの指標（デルタパワー）は下がった**。著者の仮説は「効いているのは快適さではなく、**感覚の食い違い**」── 0.3Hzより遅い揺れでは耳石器が「傾き」と「平行移動」を区別できないので、内耳の情報と目や体の情報がズレる。そのズレが効いているのではないか、と。\n・🔴 **首を左右にゆっくり揺らして同じことが起きた研究は、見つからなかった。** 首を振るのは頭の**回転**で、体の**平行移動**ではないので、上の機序の要（耳石器に届く直線加速度）を作れているかが分からない。打ったクエリ＝`head rotation vestibular stimulation sleep` / `head rocking neck movement sleep onset` / `rocking sleep spindles nap vestibular`。**「効かない」ではなく「調べられていない」。** 揺れの根拠として話すなら、**体ごとの横揺れ**までにしておく。", "keys": ["揺れ", "rocking", "前庭刺激"]}, {"cat": "尺度", "term": "PSQI（Pittsburgh Sleep Quality Index）", "en": "", "def": "🔴 **①これは何か ── 本人が自分で記入する紙（アンケート）。** 機械で測った値は1つも入っていない。\n**②何をどう数えた数か** ── 19の質問に答え、それを7つの束にまとめる：①自分で感じる睡眠の質 ②寝つくまでの時間 ③眠っていた時間 ④布団にいた時間のうち眠れた割合 ⑤眠りの妨げ（トイレ・いびき・痛みなど）⑥**睡眠薬を使ったか** ⑦**日中の困りごと**。7つを足した合計が **0〜21点**。\n🔴 **③点数の向き ── 高いほど悪い。21点が最悪。** 5点を超えると「眠りが悪い人」で、この線で良い人と悪い人を **感度89.6%・特異度86.5%** で分けられた（健常52人／うつ54人／睡眠障害62人で作られた）。訊いているのは **過去1ヶ月**のこと。\n🔴 **④スライドでは言えない例外 ── 「眠りの質」だけの物差しではない。** 睡眠薬を飲んだかと、日中の困りごとが合計に入っている。だから薬を減らしただけ、日中が楽になっただけでも点数は下がる。\n🔴 **そしてこれは自己申告なので、手技・鍼・サプリのように「受けたことが本人に分かる」介入では、期待が点数に乗る。** 偽の介入と比べていない研究では、そこを差し引けない（手技のメタ解析＝Mo Y, et al. Front Psychol. 2026;17:1815296 では、88研究のうち**52研究で参加者に伏せておらず、偽の手技と比べたデザインは1つも含まれていない**と著者が明記）。", "keys": ["PSQI", "Pittsburgh Sleep Quality Index"]}, {"cat": "尺度", "term": "ISI", "en": "Insomnia Severity Index", "def": "不眠重症度指数。不眠の重さを測る主観尺度。", "keys": ["ISI"]}, {"cat": "尺度", "term": "ESS", "en": "Epworth Sleepiness Scale", "def": "エプワース眠気尺度。日中の眠気。🔴 プロバイオティクスはPSQIだけ動いてESSは動かなかった。", "keys": ["ESS"]}, {"cat": "尺度", "term": "IRLSSG", "en": "International RLS Study Group rating scale", "def": "国際むずむず脚研究班の重症度スケール。", "keys": ["IRLSSG"]}, {"cat": "尺度", "term": "CBT-I", "en": "cognitive behavioral therapy for insomnia", "def": "不眠の認知行動療法。慢性不眠の第一選択で本WSの土台。効く中核は睡眠制限・刺激制御・認知再構成・第三世代。", "keys": ["CBT-I"]}, {"cat": "尺度", "term": "PSG（睡眠ポリグラフ）", "en": "polysomnography (PSG)", "def": "脳波を含む睡眠の客観的検査。トラッカーの数字はこれと比べると機種で精度が大きく違う。", "keys": ["PSG", "睡眠ポリグラフ"]}], COUNTS={"導入": 3, "仕組み": 33, "外す": 21, "足す": 26, "当てる": 20, "文献": 19}, N=122;
const SECS=["導入","仕組み","外す","足す","当てる","文献"];
let i=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');

/* 章チップ */
$('chaps').innerHTML=SECS.filter(s=>COUNTS[s]).map(s=>
  `<button class="chip" data-sec="${s}">${s} <span style="opacity:.7">${COUNTS[s]}</span></button>`).join('');
$('chaps').onclick=e=>{const b=e.target.closest('[data-sec]');if(!b)return;
  const k=S.findIndex(d=>d.sec===b.dataset.sec); if(k>=0) go(k);};

function go(k){
  i=Math.max(0,Math.min(N-1,k));
  const d=S[i];
  $('shot').src=d.img;
  // 前後2枚を先読みしておく（送ったときに白くならないように）
  for(const k of [i+1,i+2,i-1]){ if(S[k]){ const im=new Image(); im.src=S[k].img; } }
  $('shot').alt=d.title||('スライド'+d.n);
  $('mn').textContent=`${d.sec} ／ ${d.n} / ${N}`;
  $('mt').innerHTML=md(d.title||'');
  $('ms').innerHTML=d.src?md(d.src):'';
  $('prog').style.width=((i+1)/N*100)+'%';
  $('prev').disabled=i===0; $('next').disabled=i===N-1;
  $('tg').innerHTML = d.terms.length
    ? d.terms.map(x=>`<button class="tchip" data-t="${x}">${esc(T[x].term)}</button>`).join('')
    : '<span class="none">この枚に用語集の語はありません</span>';
  [...document.querySelectorAll('#chaps .chip')].forEach(c=>
    c.setAttribute('aria-current', c.dataset.sec===d.sec ? 'true':'false'));
  try{localStorage.setItem('ws-sleep-deck', String(i));}catch(e){}
  window.scrollTo({top:0,behavior:'instant'});
}
$('prev').onclick=()=>go(i-1); $('next').onclick=()=>go(i+1);
addEventListener('keydown',e=>{
  if(document.querySelector('.sheet')){ if(e.key==='Escape') closeSheet(); return; }
  if(e.key==='ArrowRight'||e.key===' ') {e.preventDefault(); go(i+1);}
  if(e.key==='ArrowLeft') go(i-1);
  if(e.key==='g'||e.key==='G') openGloss();
});
/* スワイプ */
let x0=null,y0=null;
$('shot').addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
$('shot').addEventListener('touchend',e=>{
  if(x0===null)return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
  if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.6) go(i+(dx<0?1:-1));
  x0=null;},{passive:true});

/* ── シート（用語集／目次） ── */
function closeSheet(){const s=document.querySelector('.sheet'); if(s) s.remove();}
function sheet(title,inner){
  closeSheet();
  const el=document.createElement('div'); el.className='sheet';
  el.innerHTML=`<div class="sheet__box"><div class="sheet__top"><h2>${esc(title)}</h2>
    <button class="tbtn" data-x>閉じる</button></div><div class="sheet__body">${inner}</div></div>`;
  el.addEventListener('click',ev=>{ if(ev.target===el||ev.target.hasAttribute('data-x')) closeSheet(); });
  document.body.appendChild(el); return el;
}
function termHTML(x,q){
  const hl=s=>{ let h=md(s); if(q){ try{ h=h.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');}catch(e){} } return h; };
  return `<div class="gterm"><dt>${hl(x.term)}</dt>${x.en?`<span class="en">${esc(x.en)}</span>`:''}<dd>${hl(x.def)}</dd></div>`;
}
function openGloss(q0,only){
  const el=sheet('用語集（128語）',
    `<input type="search" id="q" placeholder="語やキーワードで探す" value="${esc(q0||'')}">
     <div id="gl"></div>`);
  const draw=()=>{
    const q=($('q').value||'').trim();
    let list=T.map((x,idx)=>({x,idx}));
    if(only&&only.length) list=list.filter(o=>only.includes(o.idx));
    if(q) list=list.filter(o=>(o.x.term+o.x.en+o.x.def).toLowerCase().includes(q.toLowerCase()));
    const cats=[...new Set(list.map(o=>o.x.cat))];
    $('gl').innerHTML = list.length
      ? cats.map(c=>`<section class="gcat"><h4>${esc(c)}</h4>`+
          list.filter(o=>o.x.cat===c).map(o=>termHTML(o.x,q)).join('')+'</section>').join('')
      : '<p class="none" style="margin:18px 0">見つかりませんでした</p>';
  };
  $('q').addEventListener('input',draw); draw();
  if(!q0&&!only) $('q').focus();
}
$('btnGloss').onclick=()=>openGloss();
document.addEventListener('click',e=>{
  const b=e.target.closest('.tchip'); if(!b)return;
  openGloss('', [ +b.dataset.t ]);
});
$('btnToc').onclick=()=>{
  const inner=SECS.filter(s=>COUNTS[s]).map(s=>
    `<div class="tochead">${esc(s)}（${COUNTS[s]}枚）</div><div class="toc">`+
    S.map((d,k)=>({d,k})).filter(o=>o.d.sec===s).map(o=>
      `<button class="tocit" data-k="${o.k}" aria-current="${o.k===i}"><b>${o.d.n}</b>
       <span>${esc((o.d.title||'').replace(/\*\*/g,'').slice(0,26))}</span></button>`).join('')+'</div>').join('');
  const el=sheet('目次（全122枚）',inner);
  el.addEventListener('click',ev=>{const b=ev.target.closest('[data-k]'); if(b){go(+b.dataset.k); closeSheet();}});
};
let start=0; try{const v=+localStorage.getItem('ws-sleep-deck'); if(v>=0&&v<N) start=v;}catch(e){}
go(start);
</script>
